<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar usuários — ED</title><script src="auth.js"></script><style>body{margin:0;background:#070707;color:#f0e6e6;font-family:Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.card{background:#130909;border:1px solid #5c1c22;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.btn{display:inline-flex;padding:9px 12px;border-radius:10px;border:1px solid #9b1a1a;background:#241010;color:#ffd4d4;text-decoration:none;font-weight:700;cursor:pointer;margin:3px}.ok{border-color:#2b6645;color:#9fe8bb}.danger{border-color:#892828;color:#ffc0c0}input,select{width:100%;padding:10px;border-radius:9px;border:1px solid #5c1c22;background:#080303;color:#f0e6e6;margin:5px 0 10px}.user{display:flex;justify-content:space-between;gap:8px;border:1px solid #3d1a1d;border-radius:12px;padding:10px;margin:8px 0}.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.sheet{border:1px solid #3d1a1d;border-radius:12px;padding:10px;background:#0b0505}.muted{color:#9a8585;font-size:.85rem}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body data-require-auth="true"><div class="wrap"><a class="btn" href="index.html">← Hub</a><h1>Gerenciar usuários</h1><div class="grid"><div class="card"><h2>Lista</h2><div id="users"></div></div><div id="editor" class="card"><p>Selecione um usuário e aperte editar.</p></div></div></div><script>let selected=null,show=false;function guard(){const u=EDAuth.currentUser();if(!u||u.role!=='admin'){location.href='index.html'}}function render(){guard();const st=EDAuth.getStore();document.getElementById('users').innerHTML=st.users.map(u=>`<div class="user"><div><b>${u.name}</b><br><span class="muted">${u.status} • ${u.email}</span></div><button class="btn" onclick="edit('${u.id}')">Editar</button></div>`).join('');if(selected)renderEditor()}function edit(id){selected=id;show=false;renderEditor()}function renderEditor(){const st=EDAuth.getStore(),u=st.users.find(x=>x.id===selected);if(!u)return;const assigned=u.assignedSheets||[];document.getElementById('editor').innerHTML=`<h2>Editando ${u.name}</h2><label>Nome</label><input id="nm" value="${u.name||''}"><label>E-mail</label><div style="display:flex;gap:6px"><input id="em" value="${show?u.email:'*****'}" ${show?'':'readonly'}><button class="btn" onclick="show=!show;renderEditor()">👁</button></div><label>Senha</label><div style="display:flex;gap:6px"><input id="pw" value="${show?u.password:'*****'}" ${show?'':'readonly'}><button class="btn" onclick="show=!show;renderEditor()">👁</button></div><label>Status</label><select id="st"><option value="approved" ${u.status==='approved'?'selected':''}>Aprovado</option><option value="pending" ${u.status==='pending'?'selected':''}>Pendente</option><option value="denied" ${u.status==='denied'?'selected':''}>Negado</option></select><button class="btn ok" onclick="saveUser()">Salvar mudanças</button><button class="btn danger" onclick="delUser()">Excluir</button><h3>Solicitações</h3>${reqButton(u,'email')}${reqButton(u,'password')}<h3>Fichas anexadas</h3><div class="sheet-grid">${st.sheets.map(s=>`<div class="sheet"><b>${s.photo||'🧾'} ${s.name}</b><br><span class="muted">${s.version||''}</span><br>${assigned.includes(s.id)?`<button class="btn danger" onclick="toggleSheet('${s.id}',false)">Remover</button>`:`<button class="btn ok" onclick="toggleSheet('${s.id}',true)">+ Adicionar</button>`}</div>`).join('')}</div>`}function reqButton(u,k){const r=u.requests&&u.requests[k];if(!r||r.status!=='pending')return `<p class="muted">Sem solicitação de ${k==='email'?'e-mail':'senha'}.</p>`;return `<p>${k==='email'?'E-mail':'Senha'} solicitada: <b>${r.value}</b> <button class="btn ok" onclick="approve('${k}')">Aprovar</button></p>`}function saveUser(){const patch={name:document.getElementById('nm').value,status:document.getElementById('st').value};if(show){patch.email=document.getElementById('em').value;patch.password=document.getElementById('pw').value}EDAuth.updateUser(selected,patch);render()}function delUser(){if(confirm('Excluir usuário?')){EDAuth.deleteUser(selected);selected=null;render()}}function approve(k){const r=EDAuth.approveCredentialChange(selected,k);if(!r.ok)alert(r.error);render()}function toggleSheet(s,add){add?EDAuth.attachSheetToUser(selected,s):EDAuth.detachSheetFromUser(selected,s);render()}render();window.onAuthStoreChanged=render;</script></body></html>
