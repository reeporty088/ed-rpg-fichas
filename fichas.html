<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas — ED</title><script src="auth.js"></script><style>body{margin:0;background:#070707;color:#f0e6e6;font-family:Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.btn{display:inline-flex;padding:10px 14px;border-radius:10px;border:1px solid #9b1a1a;background:#241010;color:#ffd4d4;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}.card{background:#130909;border:1px solid #5c1c22;border-radius:16px;padding:18px;text-decoration:none;color:#f0e6e6}.photo{height:120px;border-radius:12px;background:#0b0505 center/cover;display:grid;place-items:center;font-size:3rem;margin-bottom:12px}.muted{color:#9a8585}</style></head><body data-require-auth="true"><div class="wrap"><a class="btn" href="index.html">← Hub</a><h1>Fichas disponíveis</h1><p class="muted">Somente aparecem as fichas liberadas para sua conta pelo ADM.</p><div id="grid" class="grid"></div></div><script>function render(){const u=EDAuth.currentUser(),st=EDAuth.getStore();const ids=u.role==='admin'?st.sheets.map(s=>s.id):(u.assignedSheets||[]);const sheets=st.sheets.filter(s=>ids.includes(s.id));document.getElementById('grid').innerHTML=sheets.map(s=>`<a class="card" href="${s.url}"><div class="photo" style="${String(s.photo||'').startsWith('data:')||String(s.photo||'').startsWith('http')?`background-image:url('${s.photo}')`:''}">${String(s.photo||'🧾').startsWith('data:')||String(s.photo||'').startsWith('http')?'':(s.photo||'🧾')}</div><h2>${s.name}</h2><div class="muted">Nível atual: ${s.level||s.nivel||'—'}</div></a>`).join('')||'<p>Nenhuma ficha liberada ainda.</p>'}render();window.onAuthStoreChanged=render;</script></body></html>
