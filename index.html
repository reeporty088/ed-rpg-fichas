<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escória de Deus - Hub de Sistemas</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1c1c1c;
            --border: #5a1a1f;
            --accent: #800000;
            --text: #f5f5f5;
            --muted: #bdbdbd;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1b1b1b, var(--bg));
            color: var(--text);
            padding: 24px;
        }

        .hub {
            width: min(560px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            padding: 28px;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        p {
            margin: 0 0 24px;
            text-align: center;
            color: var(--muted);
        }

        .buttons {
            display: grid;
            gap: 12px;
        }

        .system-btn {
            width: 100%;
            border: 1px solid #7a2a2f;
            border-radius: 12px;
            background: linear-gradient(180deg, #2a1215, #1a0d0f);
            color: var(--text);
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: not-allowed;
            opacity: 0.9;
        }

        .tag {
            display: inline-block;
            margin-top: 16px;
            background: var(--accent);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .tag-wrap {
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="hub">
        <h1>Escória de Deus</h1>
        <p>Hub principal de versões do sistema. Escolha abaixo a edição que deseja usar.</p>

        <section class="buttons" aria-label="Seleção de versões">
            <button class="system-btn" type="button" disabled>ED 1ºE</button>
            <button class="system-btn" type="button" disabled>ED 2ºE</button>
            <button class="system-btn" type="button" disabled>ED 3º</button>
        </section>

        <div class="tag-wrap">
            <span class="tag">Em breve</span>
        </div>
    </main>
</body>
</html>
