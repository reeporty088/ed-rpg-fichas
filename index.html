<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escória de Deus — Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="auth.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#130909" />
  <style>
    :root{--bg:#070707;--card:#130909;--card2:#1b0d0d;--border:#5c1c22;--accent:#9b1a1a;--bright:#cc2a2a;--text:#f0e6e6;--muted:#9a8585;--ok:#1f8b4c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Raleway,Segoe UI,sans-serif;background:radial-gradient(ellipse at top left,rgba(155,26,26,.15),transparent 42%),var(--bg);color:var(--text)}.wrap{max-width:1160px;margin:auto;padding:28px 20px 70px}.hidden{display:none!important}.portal-header{text-align:center;padding:30px 0 34px}.portal-title{font-family:Cinzel,serif;font-size:clamp(2.2rem,7vw,4.5rem);font-weight:900;letter-spacing:.08em;background:linear-gradient(#fff,#cc8080,#8b0000);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(155,26,26,.45))}.portal-subtitle{font-family:Cinzel,serif;letter-spacing:.45em;color:var(--muted);font-size:.75rem}.card{background:linear-gradient(145deg,var(--card),#090404);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 18px 45px rgba(0,0,0,.25)}.mb{margin-bottom:22px}.card-title{font-family:Cinzel,serif;letter-spacing:.08em;margin:0 0 18px;display:flex;gap:10px;align-items:center}.card-title:after{content:"";height:1px;background:var(--border);flex:1}.auth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}input,select{width:100%;border:1px solid rgba(110,44,50,.75);background:#080303;color:var(--text);border-radius:9px;padding:11px 12px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid;border-radius:10px;padding:11px 15px;background:#201313;color:var(--text);cursor:pointer;font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-decoration:none}.btn:hover{border-color:var(--bright);filter:brightness(1.15)}.btn-primary{background:linear-gradient(160deg,#5a1717,#1e0808);border-color:var(--accent);color:#ffd4d4}.btn-danger{border-color:#892828;color:#ffc0c0}.btn-ok{border-color:#2b6645;color:#9fe8bb}.btn-sm{font-size:.72rem;padding:7px 9px}.btn-full{width:100%}.msg{min-height:18px;font-size:.85rem;color:#ff9e9e;margin-top:10px}.msg.ok{color:#7fe8a8}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}.identity{display:flex;gap:14px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;border:2px solid var(--border);background:#210707 center/cover;display:grid;place-items:center;font-size:1.5rem}.name{font-family:Cinzel,serif;font-size:1.2rem}.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800}.pill-admin{border:1px solid var(--accent);color:#ff9a9a;background:rgba(155,26,26,.2)}.pill-player{border:1px solid #2a5298;color:#88aaff;background:rgba(30,80,160,.2)}.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.hub-card{min-height:160px;background:linear-gradient(145deg,#1b0b0b,#0b0505);border:1px solid var(--border);border-radius:16px;padding:20px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;justify-content:space-between;transition:.18s}.hub-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(155,26,26,.2);border-color:var(--bright)}.hub-icon{font-size:2.2rem}.hub-card b{font-family:Cinzel,serif}.hub-card span{color:var(--muted);font-size:.9rem}.side-toggle{position:fixed;top:16px;left:16px;z-index:20}.drawer{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:#100707;border-right:2px solid var(--border);z-index:30;transform:translateX(-105%);transition:.22s;padding:18px;box-shadow:15px 0 45px #000}.drawer.open{transform:translateX(0)}.drawer a{display:flex;gap:10px;color:var(--text);text-decoration:none;border:1px solid #3d1a1d;border-radius:12px;padding:13px;margin:8px 0;background:#180b0b}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.admin-list{display:grid;gap:10px}.admin-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#0c0505;border:1px solid #3d1a1d;border-radius:12px;padding:12px}.notif{font-size:.8rem;color:#ffc060}@media(max-width:760px){.auth-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.wrap{padding:60px 12px}.card{padding:18px}.portal-subtitle{letter-spacing:.2em}.admin-row{grid-template-columns:1fr}.hub-card{min-height:135px}}
  </style>
</head>
<body>
<button id="drawerBtn" class="btn btn-primary side-toggle hidden">☰</button>
<nav id="drawer" class="drawer" aria-label="Acesso rápido"><div class="drawer-head"><b>Menu rápido</b><button class="btn btn-sm" onclick="toggleDrawer(false)">✕</button></div><div id="drawerLinks"></div></nav>
<div class="wrap">
  <header class="portal-header"><div class="portal-title">Escória de Deus</div><p class="portal-subtitle">Sistema de Fichas RPG</p></header>
  <section id="authSection" class="auth-grid">
    <div class="card"><h2 class="card-title">Login</h2><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password"></div><label style="color:var(--muted);font-size:.85rem"><input id="remember" type="checkbox" style="width:auto"> Lembre-se de mim</label><button id="btnLogin" class="btn btn-primary btn-full">Entrar</button><div id="loginMsg" class="msg"></div></div>
    <div class="card"><h2 class="card-title">Registro</h2><div class="field"><label>Nome</label><input id="regName" type="text"></div><div class="field"><label>E-mail</label><input id="regEmail" type="email"></div><div class="field"><label>Senha</label><input id="regPass" type="password"></div><div class="field"><label>Confirmar senha</label><input id="regPass2" type="password"></div><button id="btnRegister" class="btn btn-primary btn-full">Registrar</button><div id="regMsg" class="msg"></div></div>
  </section>
  <section id="hubSection" class="hidden">
    <div class="card mb"><div class="topbar"><div class="identity"><div id="hubAvatar" class="avatar">⚔</div><div><div id="userName" class="name"></div><div id="userRolePill"></div></div></div><button id="btnLogout" class="btn btn-danger">Sair</button></div></div>
    <div class="card mb"><h2 class="card-title">Hub inicial</h2><div id="hubCards" class="hub-grid"></div></div>
    <div id="adminSection" class="card hidden"><h2 class="card-title">Administração rápida <span id="pendingBadge" class="notif"></span></h2><div id="adminUsers" class="admin-list"></div></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);const authSection=$('authSection'),hubSection=$('hubSection');
function isAdmin(u){return u?.role==='admin'}
function toggleDrawer(force){$('drawer').classList.toggle('open',force??!$('drawer').classList.contains('open'))}
$('drawerBtn').onclick=()=>toggleDrawer();
function avatarHTML(u){return u.avatar?`url('${u.avatar}')`:''}
function render(){const u=EDAuth.currentUser(); if(!u){authSection.classList.remove('hidden');hubSection.classList.add('hidden');$('drawerBtn').classList.add('hidden');toggleDrawer(false);return} authSection.classList.add('hidden');hubSection.classList.remove('hidden');$('drawerBtn').classList.remove('hidden');$('userName').textContent=u.name;$('hubAvatar').style.backgroundImage=avatarHTML(u);$('hubAvatar').textContent=u.avatar?'':(isAdmin(u)?'👑':'⚔');$('userRolePill').innerHTML=`<span class="pill ${isAdmin(u)?'pill-admin':'pill-player'}">${isAdmin(u)?'Administrador':'Jogador'}</span>`;renderDrawer(u);renderHubCards(u);renderAdmin(u)}
function renderDrawer(u){const links=[['👤','Perfil','perfil.html'],['🗂️','Fichas','fichas.html'],...(isAdmin(u)?[['🎲','Painel de mestre','ed_sistemav3_mestre.html'],['👥','Gerenciar usuários','usuarios.html'],['📅','Calendário','ed_sistemav1_calendario.html'],['🔔','Notificações','notificacoes.html']]:[])];$('drawerLinks').innerHTML=links.map(l=>`<a href="${l[2]}"><span>${l[0]}</span><b>${l[1]}</b></a>`).join('')}
function renderHubCards(u){const cards=[['🗂️','Fichas','Acesse as fichas liberadas pelo ADM.','fichas.html'],['👤','Perfil','Foto, nome e solicitações de conta.','perfil.html'],...(isAdmin(u)?[['👥','Gerenciar usuários','Aprove acessos e altere credenciais.','usuarios.html'],['🎲','Painel de mestre','Controle jogadores, NPCs e combate.','ed_sistemav3_mestre.html']]:[])];$('hubCards').innerHTML=cards.map(c=>`<a class="hub-card" href="${c[3]}"><div class="hub-icon">${c[0]}</div><b>${c[1]}</b><span>${c[2]}</span></a>`).join('')}
function renderAdmin(u){const sec=$('adminSection'); if(!isAdmin(u)){sec.classList.add('hidden');return} sec.classList.remove('hidden');const st=EDAuth.getStore();const pending=st.users.filter(x=>x.status==='pending').length;const unread=(st.notifications||[]).filter(n=>!n.read).length;$('pendingBadge').textContent=[pending&&`${pending} usuário(s) pendente(s)`,unread&&`${unread} notificação(ões)`].filter(Boolean).join(' • ');$('adminUsers').innerHTML=st.users.map(x=>`<div class="admin-row"><div><b>${x.name}</b><br><span style="color:var(--muted);font-size:.85rem">${x.email} — ${x.status}</span></div><a class="btn btn-sm" href="usuarios.html#${x.id}">Editar</a></div>`).join('')}
$('btnLogin').onclick=()=>{const r=EDAuth.login($('loginEmail').value,$('loginPassword').value,$('remember').checked);$('loginMsg').className='msg'+(r.ok?' ok':'');$('loginMsg').textContent=r.ok?'Login realizado.':r.error;if(r.ok)render()};
$('btnRegister').onclick=()=>{const r=EDAuth.register({name:$('regName').value,email:$('regEmail').value,password:$('regPass').value,confirmPassword:$('regPass2').value});$('regMsg').className='msg'+(r.ok?' ok':'');$('regMsg').textContent=r.ok?r.message:r.error};
['loginEmail','loginPassword','regPass2'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')(id==='regPass2'?$('btnRegister'):$('btnLogin')).click()}));$('btnLogout').onclick=()=>{EDAuth.logout();render()};window.onAuthStoreChanged=render;render();
</script><script src="pwa.js" defer></script>
</body></html>
