<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações — ED</title><script src="auth.js"></script><style>body{margin:0;background:#070707;color:#f0e6e6;font-family:Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px}.btn{display:inline-flex;padding:9px 12px;border-radius:10px;border:1px solid #9b1a1a;background:#241010;color:#ffd4d4;text-decoration:none;font-weight:700;cursor:pointer}.card{background:#130909;border:1px solid #5c1c22;border-radius:16px;padding:16px;margin:12px 0}.read{opacity:.55}.muted{color:#9a8585}</style></head><body data-require-auth="true"><div class="wrap"><a class="btn" href="index.html">← Hub</a><h1>Notificações</h1><div id="list"></div></div><script>function render(){const u=EDAuth.currentUser();if(!u||u.role!=='admin'){location.href='index.html';return}const st=EDAuth.getStore();document.getElementById('list').innerHTML=(st.notifications||[]).map(n=>`<div class="card ${n.read?'read':''}"><h3>${n.title}</h3><p>${n.message}</p><p class="muted">${new Date(n.createdAt).toLocaleString('pt-BR')}</p>${n.read?'':'<button class="btn" onclick="EDAuth.markNotificationRead(\''+n.id+'\');render()">Marcar como lida</button>'}</div>`).join('')||'<p>Nenhuma notificação.</p>'}render();window.onAuthStoreChanged=render;</script></body></html>
