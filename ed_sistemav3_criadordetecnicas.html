<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criador de Técnicas V2 - ED RPG</title>
<style>
:root{--bg:#020202;--panel:#080606;--card:#150908;--border:#3d1917;--text:#eee4d5;--muted:#a99590;--gold:#d6a85f;--blue:#8fd8ff;--input:#0e0605;--green:#2f7a4e}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;padding:20px}.wrap{max-width:1120px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title{margin:0;color:var(--gold);font-family:Georgia,serif;text-transform:uppercase;letter-spacing:3px}.btn{border:1px solid var(--border);background:#1b1110;color:#f2d9d3;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:800}.btn:hover{border-color:var(--gold)}.btn-save{background:#164327;border-color:#368f58;color:#d9ffe5}.hero{background:radial-gradient(circle at top,#111,#030303 65%);border:1px solid #24100f;border-radius:18px;min-height:520px;padding:22px;box-shadow:0 20px 60px #000}.pmbar{display:flex;justify-content:space-between;align-items:center;border:1px solid #1d2c38;background:#061019;border-radius:14px;padding:12px 16px;margin-bottom:16px}.pmbar strong{color:var(--blue);font-size:28px}.stage-title{text-align:center;color:var(--gold);font-family:Georgia,serif;font-size:36px;margin:28px 0 8px}.stage-desc{text-align:center;color:var(--muted);max-width:720px;margin:0 auto 28px;line-height:1.5;white-space:pre-wrap}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:880px;margin:0 auto}.choice{border:1px solid #3a2422;background:linear-gradient(160deg,#180c0b,#070404);border-radius:14px;padding:16px;min-height:96px;color:var(--text);cursor:pointer;text-align:left}.choice.selected{border-color:var(--gold);box-shadow:0 0 0 2px #d6a85f33}.choice-title{color:#f2c76f;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.choice-meta{color:#9ed6ff;font-size:12px}.choice-desc{font-size:12px;color:#bfaeaa;margin-top:6px;line-height:1.35}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.path{font-size:12px;color:#b7aaa5;text-align:center;margin-bottom:12px}.final-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.section{border:1px solid var(--border);border-radius:14px;background:#090504;padding:14px}label{display:block;color:#e7a99a;font-size:11px;font-weight:900;text-transform:uppercase;margin:0 0 6px}input,textarea{width:100%;border:1px solid #3a2422;background:var(--input);color:var(--text);border-radius:8px;padding:10px}textarea{min-height:130px;resize:vertical}.card-preview{overflow:hidden;border:1px solid var(--border);border-radius:16px;background:#080404;min-height:460px}.card-img{height:190px;background:var(--tech-bg,radial-gradient(circle at top,#25364d,#210808));background-size:cover;background-position:center}.card-body{padding:14px}.card-title{font-family:Georgia,serif;color:var(--gold);font-size:24px;margin:0}.details{border-top:1px solid #33201f;margin-top:10px;padding-top:10px;color:#d8cac4;white-space:pre-wrap;font-size:13px;line-height:1.45}.hidden{display:none!important}.empty{color:#846f6a;text-align:center;padding:30px;border:1px dashed #33201f;border-radius:14px}.warn{color:#ffcf8f;text-align:center;margin:14px 0}@media(max-width:800px){.final-grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.stage-title{font-size:28px}}
</style>
<script src="auth.js"></script>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
</head>
<body data-require-auth="true" data-required-version="v3">
<div class="wrap">
  <div class="top"><h1 class="title">Técnicas</h1><div><button class="btn" onclick="goBack()">← Voltar</button> <button class="btn btn-save hidden" id="saveTop" onclick="saveTechnique()">Salvar Técnica</button></div></div>
  <main class="hero">
    <div class="pmbar"><span>Custo atual da técnica</span><strong><span id="pmTotal">0</span> PM</strong></div>
    <div id="builderPanel">
      <div class="stage-title" id="stageTitle">Técnicas</div>
      <div class="stage-desc" id="stageDesc">Clique em começar para seguir a lógica definida no Compêndio.</div>
      <div class="path" id="pathText"></div>
      <div class="choice-grid" id="choiceGrid"></div>
      <div class="warn" id="warnText"></div>
      <div class="nav"><button class="btn btn-save" id="startBtn" onclick="startFlow()">Começar</button><button class="btn hidden" id="backBtn" onclick="stepBack()">← Voltar etapa</button><button class="btn btn-save hidden" id="nextBtn" onclick="advanceFlow()">Avançar →</button></div>
    </div>
    <div id="finalPanel" class="hidden">
      <div class="final-grid">
        <section class="section"><label>Título da técnica</label><input id="titulo" placeholder="Nome da técnica"><label style="margin-top:12px">Descrição</label><textarea id="desc" placeholder="Escreva a descrição da técnica..."></textarea><label style="margin-top:12px">Imagem opcional</label><input id="imagemFile" type="file" accept="image/*"><label style="margin-top:12px">Observações extras</label><textarea id="obs" placeholder="Regras extras, testes, restrições..."></textarea><div class="nav"><button class="btn" onclick="returnToChoices()">← Rever escolhas</button><button class="btn btn-save" onclick="saveTechnique()">Salvar Técnica</button></div></section>
        <aside class="card-preview" id="preview"><div class="card-img"></div><div class="card-body"><h2 class="card-title" id="pvTitle">Técnica sem nome</h2><div class="details"><b>Custo</b><br><span id="pvCost">0 PM</span></div><div class="details"><b>Construção</b><br><span id="pvPath"></span></div><div class="details"><b>Descrição</b><br><span id="pvDesc">Sem descrição.</span></div></div></aside>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, update, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCvxxwfsonP5a45nbcz34cxYhXaWBZVhwQ",authDomain:"ed-rpg---sistema-de-fichas.firebaseapp.com",databaseURL:"https://ed-rpg---sistema-de-fichas-default-rtdb.firebaseio.com",projectId:"ed-rpg---sistema-de-fichas",storageBucket:"ed-rpg---sistema-de-fichas.firebasestorage.app",messagingSenderId:"350999444010",appId:"1:350999444010:web:d89f31d13e449b8fbfa153"};
const db=getDatabase(initializeApp(firebaseConfig));
const params=new URLSearchParams(location.search);
const source=params.get('source')||'compendium';
const ficha=params.get('ficha')||'';
const editId=params.get('edit')||'';
const legacyEdit=params.get('legacy')==='1';
const FICHA_TECH_CAT='tecnicas_v2';
const LEGACY_TECH_CAT='tecnicas';
let logic={nodes:{},edges:{}};let currentNodeId='';let selectedNextId='';let pathIds=[];let imageData='';let editCompendiumId='';
function esc(s=''){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function node(id){return logic.nodes?.[id]||{nome:id,desc:'',custo_pm:0}}
function children(id){return Object.values(logic.edges||{}).filter(e=>e.from===id&&logic.nodes?.[e.to]).map(e=>({id:e.to,...logic.nodes[e.to]}))}
function pathNodes(){return pathIds.map(id=>node(id))}
function totalCost(){return pathNodes().reduce((sum,n)=>sum+(Number(n.custo_pm)||0),0)}
function pathText(){return pathNodes().map(n=>n.nome||'Sem nome').join(' → ')}
function ensureStart(){if(logic.nodes?.start)return;logic={nodes:{start:{nome:'Começar',desc:'Bloco inicial. Configure a lógica no Compêndio > Lógica de Técnicas.',custo_pm:0,final:false}},edges:{}}}
function renderStep(){ensureStart();document.getElementById('pmTotal').textContent=totalCost();document.getElementById('pathText').textContent=pathText();document.getElementById('warnText').textContent='';document.getElementById('startBtn').classList.toggle('hidden',!!currentNodeId);document.getElementById('backBtn').classList.toggle('hidden',!pathIds.length);document.getElementById('nextBtn').classList.toggle('hidden',!currentNodeId);const cur=currentNodeId?node(currentNodeId):node('start');document.getElementById('stageTitle').textContent=currentNodeId?(cur.nome||'Etapa'):'Técnicas';document.getElementById('stageDesc').textContent=currentNodeId?(cur.desc||'Escolha uma opção para continuar.'):'Clique em começar para seguir a lógica definida no Compêndio.';const opts=children(currentNodeId||'start');if(currentNodeId&&cur.final){showFinal();return}if(currentNodeId&&!opts.length){document.getElementById('warnText').textContent='Este ramo não possui próximos blocos. Marque-o como finalizador ou crie uma seta na aba Lógica de Técnicas.'}document.getElementById('choiceGrid').innerHTML=opts.length?opts.map(o=>`<button class="choice ${selectedNextId===o.id?'selected':''}" onclick="selectChoice('${esc(o.id)}')"><div class="choice-title">${esc(o.nome)}</div><div class="choice-meta">${Number(o.custo_pm)||0} PM${o.final?' • Finalizador':''}</div><div class="choice-desc">${esc(o.desc||'')}</div></button>`).join(''):'<div class="empty">Nenhuma opção disponível.</div>'}
window.startFlow=()=>{currentNodeId='start';pathIds=['start'];selectedNextId='';renderStep()};
window.selectChoice=(id)=>{selectedNextId=id;renderStep()};
window.advanceFlow=()=>{if(!selectedNextId){alert('Escolha uma opção antes de avançar.');return}currentNodeId=selectedNextId;pathIds.push(currentNodeId);selectedNextId='';renderStep()};
window.stepBack=()=>{if(!pathIds.length)return;pathIds.pop();currentNodeId=pathIds[pathIds.length-1]||'';selectedNextId='';hideFinal();renderStep()};
function showFinal(){document.getElementById('builderPanel').classList.add('hidden');document.getElementById('finalPanel').classList.remove('hidden');document.getElementById('saveTop').classList.remove('hidden');renderPreview()}
function hideFinal(){document.getElementById('builderPanel').classList.remove('hidden');document.getElementById('finalPanel').classList.add('hidden');document.getElementById('saveTop').classList.add('hidden')}
window.returnToChoices=()=>{hideFinal();renderStep()};
function renderPreview(){document.getElementById('pmTotal').textContent=totalCost();document.getElementById('pvTitle').textContent=document.getElementById('titulo').value||'Técnica sem nome';document.getElementById('pvCost').textContent=totalCost()+' PM';document.getElementById('pvPath').textContent=pathText()||'Sem construção.';document.getElementById('pvDesc').textContent=document.getElementById('desc').value||'Sem descrição.';document.getElementById('preview').style.setProperty('--tech-bg',imageData?`url('${imageData}')`:'radial-gradient(circle at top,#25364d,#210808)')}
function bindFinal(){['titulo','desc','obs'].forEach(id=>document.getElementById(id).addEventListener('input',renderPreview));document.getElementById('imagemFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;imageData=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});renderPreview()})}
function deriveSubtype(){const names=pathNodes().map(n=>norm(n.nome)).join(' ');if(names.includes('conjur'))return 'CONJURAÇÃO';if(names.includes('clamor'))return 'CLAMOR';if(names.includes('feit'))return 'FEITIÇO';if(names.includes('fisic'))return 'FÍSICO';if(names.includes('perjur'))return 'PERJURAÇÃO';return pathNodes()[1]?.nome||''}
function deriveType(){const names=pathNodes().map(n=>norm(n.nome)).join(' ');if(names.includes('feit')||names.includes('conjur')||names.includes('clamor'))return 'FEITIÇOS';if(names.includes('perjur'))return 'PERJURAÇÃO';if(names.includes('fisic'))return 'FÍSICO';return pathNodes()[1]?.nome||'Técnica'}
async function loadEdit(){
  if(!editId||!ficha)return;
  const cat=legacyEdit?LEGACY_TECH_CAT:FICHA_TECH_CAT;
  let snap=await get(ref(db,`fichas_v3/${ficha}/habilidades/${cat}/${editId}`));
  if(!snap.exists()&&!legacyEdit){
    snap=await get(ref(db,`fichas_v3/${ficha}/habilidades/${LEGACY_TECH_CAT}/${editId}`));
  }
  const t=snap.val();
  if(!t)return;
  editCompendiumId=t.compendium_id||'';
  document.getElementById('titulo').value=t.titulo||'';
  document.getElementById('desc').value=t.desc||'';
  document.getElementById('obs').value=t.obs||'';
  imageData=t.imagem||'';
  pathIds=t.tecnica_path_ids||[];
  currentNodeId=pathIds[pathIds.length-1]||'';
  showFinal();
}
window.goBack=()=>{location.href=source==='ficha'&&ficha?`ed_sistemav3_ficha.html?p=${encodeURIComponent(ficha)}`:'ed_sistemav3_bancodedados.html'};
window.saveTechnique=async()=>{
  const title=document.getElementById('titulo').value.trim();
  if(!title){alert('Informe o título da técnica.');return}
  const details=pathNodes().map(n=>`${n.nome || 'Sem nome'}${Number(n.custo_pm)?` (${Number(n.custo_pm)} PM)`:''}${n.desc?` — ${n.desc}`:''}`);
  const payload={
    titulo:title,
    tipo:deriveType(),
    subtipo:deriveSubtype(),
    categoria:pathNodes()[2]?.nome||'',
    custo_pm:totalCost(),
    custo_pm_base:totalCost(),
    imagem:imageData,
    detalhes:pathNodes().map(n=>({label:n.nome||'Sem nome',value:n.desc||'',custo_pm:Number(n.custo_pm)||0})),
    detalhes_texto:details.join('\n'),
    tecnica_path_ids:pathIds,
    desc:document.getElementById('desc').value.trim(),
    obs:document.getElementById('obs').value.trim(),
    created_at:new Date().toISOString(),
    creator_source:source
  };
  let compKey=editCompendiumId||push(ref(db,'banco_dados_v3/tecnicas_v2')).key;
  const updates={[`banco_dados_v3/tecnicas_v2/${compKey}`]:payload};
  if(source==='ficha'&&ficha){
    const cat=legacyEdit?LEGACY_TECH_CAT:FICHA_TECH_CAT;
    const key=editId||push(ref(db,`fichas_v3/${ficha}/habilidades/${FICHA_TECH_CAT}`)).key;
    updates[`fichas_v3/${ficha}/habilidades/${cat}/${key}`]={...payload,compendium_id:compKey,attached_ficha_id:ficha};
  }
  await update(ref(db),updates);
  alert('Técnica salva com sucesso!');
  goBack();
};
onValue(ref(db,'banco_dados_v3/logica_tecnicas'),snap=>{logic=snap.val()||{};ensureStart();if(!currentNodeId&&!pathIds.length)renderStep();else if(!document.getElementById('finalPanel').classList.contains('hidden'))renderPreview();else renderStep()});
bindFinal();loadEdit();renderStep();
</script><script src="pwa.js" defer></script>
</body></html>
