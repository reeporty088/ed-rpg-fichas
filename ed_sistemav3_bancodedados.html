<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de Dados V3 - Escória de Deus</title>
  <style>
    :root { --bg:#0a0a0a; --text:#eee4d5; --main:#7a1a1a; --light:#e8a090; --card:#1a0a08; --border:#4a1a18; --input:#120605; }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
    h1 { text-align:center; color:var(--light); margin:0 0 16px; text-transform:uppercase; letter-spacing:2px; }
    .container { max-width:1280px; margin:0 auto; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .tab-btn { background:#1b1110; border:1px solid var(--border); color:#bda7a4; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:700; }
    .tab-btn.active { background:var(--main); color:#fff; border-color:var(--light); }
    .card { background:linear-gradient(160deg,var(--card),#0d0604); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .btn { border:1px solid var(--border); background:#1f1413; color:#f2d9d3; border-radius:7px; padding:8px 12px; cursor:pointer; font-weight:700; }
    .btn:hover { border-color:var(--light); }
    .btn-add { background:#1b4d2f; border-color:#2f7a4e; color:#b6efc7; }
    .btn-warn { background:#66460d; border-color:#9b7433; color:#ffe5af; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
    .item { background:rgba(0,0,0,.3); border:1px solid #37201e; border-radius:10px; padding:10px; }
    .item h4 { margin:0 0 6px; color:var(--light); }
    .meta { font-size:12px; color:#bca8a5; margin-bottom:6px; }
    .desc { white-space:pre-wrap; font-size:13px; color:#d6c8c4; line-height:1.4; }
    .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
    .btn-edit { background:#66460d; border-color:#9b7433; color:#ffe5af; }
    .btn-del { background:#5a1515; border-color:#8a2525; color:#ffc3c3; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); align-items:center; justify-content:center; padding:16px; }
    .modal.open { display:flex; }
    .box { width:min(820px,100%); max-height:90vh; overflow-y:auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label { font-size:11px; font-weight:700; color:var(--light); text-transform:uppercase; margin:8px 0 4px; display:block; }
    input, textarea, select { width:100%; border-radius:7px; border:1px solid #3a2422; background:var(--input); color:var(--text); padding:8px; }
    textarea { min-height:80px; resize:vertical; }
    .hidden { display:none; }
    .hint { font-size:12px; color:#c9b2ae; }
  </style>
  <script src="auth.js"></script>
</head>
<body data-require-auth="true" data-required-version="v3">
<div class="container">
  <h1>Compêndio do Mestre — v3</h1>

  <div class="toolbar card" style="margin-bottom:12px;">
    <div>
      <strong>Importação em lote (JSON/TXT)</strong>
      <div class="hint">Baixe o modelo da aba ativa, preencha e importe para criar cards automaticamente.</div>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
      <button class="btn" onclick="downloadTemplate('json')">⬇ Modelo JSON</button>
      <button class="btn" onclick="downloadTemplate('txt')">⬇ Modelo TXT</button>
      <input type="file" id="importFile" accept=".json,.txt" onchange="importItems(event)" style="max-width:260px;">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <section id="sec_main" class="card">
    <div class="header">
      <h3 id="sec_title" style="margin:0"></h3>
      <div id="btn_area_novo"><button class="btn btn-add" onclick="openCurrentTabForm()">+ Novo Item</button></div>
    </div>
    <div class="grid" id="list_current"></div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="modalTitle" style="margin-top:0"></h3>
    <input id="editId" type="hidden" />
    <div id="dynamicFields"></div>
    <div class="actions">
      <button class="btn" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-add" onclick="saveItem()">Salvar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvxxwfsonP5a45nbcz34cxYhXaWBZVhwQ",
  authDomain: "ed-rpg---sistema-de-fichas.firebaseapp.com",
  databaseURL: "https://ed-rpg---sistema-de-fichas-default-rtdb.firebaseio.com",
  projectId: "ed-rpg---sistema-de-fichas",
  storageBucket: "ed-rpg---sistema-de-fichas.firebasestorage.app",
  messagingSenderId: "350999444010",
  appId: "1:350999444010:web:d89f31d13e449b8fbfa153"
};

const db = getDatabase(initializeApp(firebaseConfig));
const dbPath = 'banco_dados_v3';

const PERICIAS_LIST = ['Animais','Arte','Atirar','Conhecimento','Energia','Esquiva','Esporte','Fortitude','Influência','Intuição','Ladinagem','Luta','Máquinas','Medicina','Mente','Mística','Percepção','Sobrevivência','Vitalidade','Vontade'];
const CAMINHOS_LIST = ['Aprimorar','Emitir','Moldar','Manipular'];
const ALCANCES_LIST = ['Corpo a corpo','1 bloco','2 blocos','3 blocos','4 blocos','5 blocos','6 blocos','8 blocos','10 blocos','12 blocos'];
const AREAS_LIST    = ['Nenhuma','1 bloco raio','2 blocos raio','3 blocos raio','4 blocos raio','5 blocos raio','6 blocos raio','Linha 3 blocos','Linha 5 blocos','Cone 3 blocos'];
const DADOS_LIST    = ['Nenhum','1d4','1d6','1d8','1d10','1d12','2d4','2d6','2d8','2d10','3d6','3d8','4d6'];
const DURACOES_LIST = ['Instantâneo','1 turno','2 turnos','3 turnos','4 turnos','5 turnos','Até fim da cena','Sustentado'];

const CATEGORIES = {
  racas: {
    label: '🧬 Raças',
    fields: [
      { key:'titulo', label:'Título', type:'text', required:true },
      { key:'linhagem', label:'Linhagem', type:'text' },
      { key:'desc', label:'Descrição', type:'textarea' },
      { key:'hab1_nome', label:'Habilidade 1 (nome)', type:'text' },
      { key:'hab1_desc', label:'Habilidade 1 (descrição)', type:'textarea' },
      { key:'hab2_nome', label:'Habilidade 2 (nome)', type:'text' },
      { key:'hab2_desc', label:'Habilidade 2 (descrição)', type:'textarea' },
      { key:'hab3_nome', label:'Habilidade 3 (nome)', type:'text' },
      { key:'hab3_desc', label:'Habilidade 3 (descrição)', type:'textarea' }
    ],
    meta: (it) => `Linhagem: ${it.linhagem || '-'}`,
    descField: 'desc'
  },
  classes: {
    label: '⚔️ Classes',
    fields: [
      { key:'titulo', label:'Título', type:'text', required:true },
      { key:'desc', label:'Descrição', type:'textarea' },
      { key:'dominios', label:'Domínios', type:'text' },
      { key:'hab_nome', label:'Habilidade base (nome)', type:'text' },
      { key:'hab_desc', label:'Habilidade base (descrição)', type:'textarea' },
      { key:'hab2_nome', label:'Habilidade 2 (nome)', type:'text' },
      { key:'hab2_desc', label:'Habilidade 2 (descrição)', type:'textarea' }
    ],
    meta: (it) => `Domínios: ${it.dominios || '-'}`,
    descField: 'desc'
  },
  tecnicas: {
    label: '🗡️ Técnicas',
    fields: [
      { key:'titulo',    label:'Título',        type:'text',     required:true },
      { key:'caminho',   label:'Caminho Arcano', type:'select',   options: CAMINHOS_LIST },
      { key:'pericia',   label:'Perícia',        type:'select',   options: PERICIAS_LIST },
      { key:'custo_pm',  label:'Custo PM',       type:'text' },
      { key:'alcance',   label:'Alcance',        type:'select',   options: ALCANCES_LIST },
      { key:'area',      label:'Área',           type:'select',   options: AREAS_LIST },
      { key:'dados',     label:'Dados',          type:'select',   options: DADOS_LIST },
      { key:'duracao',   label:'Duração',        type:'select',   options: DURACOES_LIST },
      { key:'desc',      label:'Descrição',      type:'textarea' }
    ],
    meta: (it) => `Caminho: ${it.caminho || '-'} • Perícia: ${it.pericia || '-'}`,
    descField: 'desc'
  },
  caminhos_arcanos: {
    label: '🌌 Caminhos Arcanos',
    fields: [
      { key:'titulo', label:'Título', type:'text', required:true },
      { key:'foco', label:'Foco/Estilo', type:'text' },
      { key:'dominio', label:'Domínio', type:'text' },
      { key:'desc', label:'Descrição', type:'textarea' }
    ],
    meta: (it) => `Domínio: ${it.dominio || '-'}`,
    descField: 'desc'
  },
  equipamentos: {
    label: '🎒 Equipamentos',
    fields: [
      { key:'titulo', label:'Título', type:'text', required:true },
      { key:'categoria', label:'Categoria', type:'text' },
      { key:'atributo', label:'Atributo', type:'text' },
      { key:'alcance', label:'Alcance', type:'text' },
      { key:'dano', label:'Dano', type:'text' },
      { key:'tipo', label:'Tipo', type:'text' },
      { key:'custo', label:'Custo', type:'text' },
      { key:'desc', label:'Descrição', type:'textarea' }
    ],
    meta: (it) => `Categoria: ${it.categoria || '-'} • Atributo: ${it.atributo || '-'}`,
    descField: 'desc'
  },
  ascensao_arcana: {
    label: '✨ Ascensão Arcana',
    fields: [
      { key:'titulo', label:'Título', type:'text', required:true },
      { key:'ramo', label:'Ramo', type:'text' },
      { key:'custo', label:'Custo (XP/Pulso)', type:'text' },
      { key:'efeito', label:'Efeito', type:'textarea' },
      { key:'desc', label:'Descrição', type:'textarea' }
    ],
    meta: (it) => `Ramo: ${it.ramo || '-'} • Custo: ${it.custo || '-'}`,
    descField: 'desc'
  }
};

const CUSTO_ALCANCE_DB = {'Corpo a corpo':0,'1 bloco':1,'2 blocos':2,'3 blocos':4,'4 blocos':6,'5 blocos':8,'6 blocos':10,'8 blocos':14,'10 blocos':17,'12 blocos':20};
const CUSTO_AREA_DB    = {'Nenhuma':0,'1 bloco raio':2,'2 blocos raio':5,'3 blocos raio':9,'4 blocos raio':13,'5 blocos raio':16,'6 blocos raio':18,'Linha 3 blocos':3,'Linha 5 blocos':6,'Cone 3 blocos':4};
const CUSTO_DADOS_DB   = {'Nenhum':0,'1d4':1,'1d6':3,'1d8':5,'1d10':8,'1d12':11,'2d4':4,'2d6':8,'2d8':12,'2d10':16,'3d6':13,'3d8':18,'4d6':18};
const CUSTO_DURACAO_DB = {'Instantâneo':0,'1 turno':1,'2 turnos':3,'3 turnos':5,'4 turnos':8,'5 turnos':11,'Até fim da cena':15,'Sustentado':20};

function calcTecnicaCustoDB() {
  const alcance = document.getElementById('f_alcance')?.value || '';
  const area    = document.getElementById('f_area')?.value    || '';
  const dados   = document.getElementById('f_dados')?.value   || '';
  const duracao = document.getElementById('f_duracao')?.value || '';
  const total   = (CUSTO_ALCANCE_DB[alcance] ?? 0) + (CUSTO_AREA_DB[area] ?? 0) +
                  (CUSTO_DADOS_DB[dados] ?? 0) + (CUSTO_DURACAO_DB[duracao] ?? 0);
  const pmEl = document.getElementById('f_custo_pm');
  if (pmEl) pmEl.value = total;
}

let currentTab = 'racas';
let globalData = Object.fromEntries(Object.keys(CATEGORIES).map(k => [k, {}]));
let globalPlayers = {};
let tecnicaFormMode = 'guiado';

function esc(s){ return (s ?? '').toString().replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = Object.entries(CATEGORIES).map(([key, cfg]) =>
    `<button class="tab-btn ${key===currentTab?'active':''}" onclick="switchTab('${key}')">${cfg.label}</button>`
  ).join('');
}

function renderCompendiumItems(cat) {
  const cfg = CATEGORIES[cat];
  const arr = Object.entries(globalData[cat] || {})
    .map(([id, v]) => ({ id, ...(v || {}) }))
    .sort((a,b) => (a.titulo || '').localeCompare(b.titulo || ''));

  if (!arr.length) return '<div style="opacity:.65; margin-bottom:12px;">Nenhum registro nessa categoria.</div>';
  return '<div class="grid" style="margin-bottom:4px;">' + arr.map(it => `
    <div class="item">
      <h4>${esc(it.titulo || it.id)}</h4>
      <div class="meta">${esc(cfg.meta(it))}</div>
      <div class="desc">${esc(it[cfg.descField] || '')}</div>
      <div class="actions">
        <button class="btn btn-edit" onclick="openForm('${cat}','${it.id}')">Editar</button>
        <button class="btn btn-del" onclick="deleteItem('${cat}','${it.id}')">Excluir</button>
      </div>
    </div>
  `).join('') + '</div>';
}

function renderPlayerTecnicas() {
  let html = '';
  let any = false;

  Object.entries(globalPlayers || {}).forEach(([fichaId, fichaData]) => {
    const tecnicas = fichaData?.habilidades?.tecnicas || {};
    const charName = fichaData?.char_name || fichaId;
    const entries = Object.entries(tecnicas);
    if (!entries.length) return;

    html += `<div style="grid-column:1/-1; font-size:11px; font-weight:700; color:#bda7a4; text-transform:uppercase; letter-spacing:1px; margin:4px 0 2px; font-family:'Segoe UI',sans-serif;">${esc(charName)}</div>`;
    entries.forEach(([techId, tech]) => {
      any = true;
      html += `
        <div class="item">
          <h4>${esc(tech.titulo || techId)}</h4>
          <div class="meta">Caminho: ${esc(tech.caminho||'-')} • Perícia: ${esc(tech.pericia||'-')}</div>
          <div class="meta">PM: ${esc(tech.custo_pm||'-')} • Alcance: ${esc(tech.alcance||'-')} • Área: ${esc(tech.area||'-')}</div>
          <div class="meta">Dados: ${esc(tech.dados||'-')} • Duração: ${esc(tech.duracao||'-')}</div>
          <div class="desc">${esc(tech.desc||'')}</div>
          <div class="actions">
            <button class="btn btn-warn" onclick="savePlayerTechToCompendium('${esc(fichaId)}','${esc(techId)}')">Salvar no Compêndio</button>
            <button class="btn btn-del" onclick="deletePlayerTech('${esc(fichaId)}','${esc(techId)}')">Excluir</button>
          </div>
        </div>`;
    });
  });

  if (!any) return '<div style="opacity:.65;">Nenhuma técnica criada por jogadores ainda.</div>';
  return '<div class="grid">' + html + '</div>';
}

function renderCurrent(){
  const cfg = CATEGORIES[currentTab];
  document.getElementById('sec_title').innerText = cfg.label;
  const list = document.getElementById('list_current');

  if (currentTab === 'tecnicas') {
    document.getElementById('btn_area_novo').innerHTML = `
      <div style="display:flex;gap:6px;">
        <button class="btn btn-add" onclick="openTecnicaForm('guiado')" title="Criar técnica com dropdowns e cálculo automático de PM">⊞ Guiado</button>
        <button class="btn" style="border-color:#777;color:#ccc;" onclick="openTecnicaForm('manual')" title="Criar técnica com campos de texto livre">✎ Manual</button>
      </div>`;
    list.className = '';
    list.style.cssText = '';
    list.innerHTML =
      '<div style="font-weight:700; color:var(--light); font-size:12px; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:12px;">Técnicas do Compêndio</div>' +
      renderCompendiumItems('tecnicas') +
      '<div style="font-weight:700; color:var(--light); font-size:12px; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border); padding-bottom:8px; margin:16px 0 12px;">Técnicas dos Jogadores</div>' +
      renderPlayerTecnicas();
    return;
  }

  document.getElementById('btn_area_novo').innerHTML = '<button class="btn btn-add" onclick="openCurrentTabForm()">+ Novo Item</button>';
  list.className = 'grid';
  const arr = Object.entries(globalData[currentTab] || {})
    .map(([id, v]) => ({ id, ...(v || {}) }))
    .sort((a,b) => (a.titulo || '').localeCompare(b.titulo || ''));

  if (!arr.length) {
    list.innerHTML = '<div style="opacity:.65">Nenhum registro nessa categoria.</div>';
    return;
  }

  list.innerHTML = arr.map(it => `
    <div class="item">
      <h4>${esc(it.titulo || it.id)}</h4>
      <div class="meta">${esc(cfg.meta(it))}</div>
      <div class="desc">${esc(it[cfg.descField] || '')}</div>
      <div class="actions">
        <button class="btn btn-edit" onclick="openForm('${currentTab}','${it.id}')">Editar</button>
        <button class="btn btn-del" onclick="deleteItem('${currentTab}','${it.id}')">Excluir</button>
      </div>
    </div>
  `).join('');
}

function buildFields(cat, data = {}, forceText = false){
  const cfg = CATEGORIES[cat];
  return cfg.fields.map(f => {
    const value = data[f.key] ?? '';
    if (f.type === 'textarea') {
      return `<label>${f.label}${f.required?' *':''}</label><textarea id="f_${f.key}" data-key="${f.key}">${esc(value)}</textarea>`;
    }
    if (f.type === 'select' && !forceText) {
      const opts = f.options.map(o => `<option value="${esc(o)}" ${value === o ? 'selected' : ''}>${esc(o)}</option>`).join('');
      return `<label>${f.label}${f.required?' *':''}</label><select id="f_${f.key}" data-key="${f.key}"><option value="">-- Selecionar --</option>${opts}</select>`;
    }
    return `<label>${f.label}${f.required?' *':''}</label><input id="f_${f.key}" data-key="${f.key}" type="text" value="${esc(value)}" placeholder="${esc(f.label)}" />`;
  }).join('');
}

window.switchTab = (tab) => { currentTab = tab; renderTabs(); renderCurrent(); };
window.openCurrentTabForm = () => window.openForm(currentTab);
window.openTecnicaForm = (mode) => { tecnicaFormMode = mode; window.openForm('tecnicas'); };

window.openForm = (cat, id='') => {
  const item = id ? (globalData[cat] || {})[id] || {} : {};
  // Editing always uses guiado; creating respects the user-chosen mode
  const formMode = (cat === 'tecnicas' && !id) ? tecnicaFormMode : 'guiado';
  document.getElementById('editId').value = id;
  const modeLabel = (cat === 'tecnicas' && !id) ? ` — ${formMode === 'guiado' ? '⊞ Guiado' : '✎ Manual'}` : '';
  document.getElementById('modalTitle').innerText = `${id ? 'Editar' : 'Criar'} ${CATEGORIES[cat].label}${modeLabel}`;
  document.getElementById('dynamicFields').innerHTML = buildFields(cat, item, cat === 'tecnicas' && formMode === 'manual');
  document.getElementById('modal').dataset.category = cat;

  if (cat === 'tecnicas' && formMode === 'guiado') {
    const pmEl = document.getElementById('f_custo_pm');
    if (pmEl) { pmEl.readOnly = true; pmEl.style.cssText = 'cursor:not-allowed; opacity:0.7; width:100%; border-radius:7px; border:1px solid #3a2422; background:var(--input); color:var(--text); padding:8px;'; }
    ['f_alcance','f_area','f_dados','f_duracao'].forEach(fid => {
      document.getElementById(fid)?.addEventListener('change', calcTecnicaCustoDB);
    });
    calcTecnicaCustoDB();
  }

  document.getElementById('modal').classList.add('open');
};
window.closeForm = () => document.getElementById('modal').classList.remove('open');

function collectFormData(cat){
  const cfg = CATEGORIES[cat];
  const out = {};
  for (const f of cfg.fields) {
    const val = (document.getElementById(`f_${f.key}`)?.value || '').trim();
    if (f.required && !val) throw new Error(`Campo obrigatório: ${f.label}`);
    out[f.key] = val;
  }
  return out;
}

window.saveItem = async () => {
  const cat = document.getElementById('modal').dataset.category;
  const id = document.getElementById('editId').value;
  let payload;
  try { payload = collectFormData(cat); } catch (err) { alert(err.message); return; }
  if (id) await update(ref(db, `${dbPath}/${cat}/${id}`), payload);
  else {
    const k = push(ref(db, `${dbPath}/${cat}`)).key;
    await update(ref(db, `${dbPath}/${cat}/${k}`), payload);
  }
  closeForm();
};

window.deleteItem = async (cat, id) => {
  if (!confirm('Excluir este item do banco?')) return;
  await remove(ref(db, `${dbPath}/${cat}/${id}`));
};

window.savePlayerTechToCompendium = async (fichaId, techId) => {
  const tech = globalPlayers[fichaId]?.habilidades?.tecnicas?.[techId];
  if (!tech) return;
  const payload = {
    titulo:   tech.titulo   || '',
    caminho:  tech.caminho  || '',
    pericia:  tech.pericia  || '',
    custo_pm: tech.custo_pm || '',
    alcance:  tech.alcance  || '',
    area:     tech.area     || '',
    dados:    tech.dados    || '',
    duracao:  tech.duracao  || '',
    desc:     tech.desc     || ''
  };
  const k = push(ref(db, `${dbPath}/tecnicas`)).key;
  await update(ref(db, `${dbPath}/tecnicas/${k}`), payload);
  alert('Técnica salva no Compêndio!');
};

window.deletePlayerTech = async (fichaId, techId) => {
  if (!confirm('Excluir esta técnica da ficha do jogador?')) return;
  await remove(ref(db, `fichas_v3/${fichaId}/habilidades/tecnicas/${techId}`));
};

function makeTemplate(cat){
  const fields = CATEGORIES[cat].fields.map(f => f.key);
  const model = {};
  fields.forEach((k) => model[k] = '');
  return { categoria: cat, instrucoes: 'Preencha os objetos em itens. Apenas itens com titulo serão importados.', itens: [model] };
}

window.downloadTemplate = (format='json') => {
  const model = makeTemplate(currentTab);
  let content = '';
  let filename = `modelo_${currentTab}.${format}`;
  if (format === 'json') {
    content = JSON.stringify(model, null, 2);
  } else {
    const keys = Object.keys(model.itens[0]);
    content = [
      `# MODELO ${currentTab.toUpperCase()}`,
      '# Use blocos separados por ---',
      ...keys.map(k => `${k}: `),
      '---',
      ...keys.map(k => `${k}: `)
    ].join('\n');
  }
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
};

function parseTxtImport(raw){
  const blocks = raw.split(/\n\s*---\s*\n/g).map(b => b.trim()).filter(Boolean);
  const items = blocks.map(block => {
    const obj = {};
    block.split('\n').forEach(line => {
      if (!line.includes(':')) return;
      const [k, ...rest] = line.split(':');
      obj[k.trim()] = rest.join(':').trim();
    });
    return obj;
  });
  return { categoria: currentTab, itens: items };
}

window.importItems = async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  const text = await file.text();
  let parsed;
  try {
    parsed = file.name.toLowerCase().endsWith('.json') ? JSON.parse(text) : parseTxtImport(text);
  } catch {
    alert('Arquivo inválido. Use o modelo de importação.');
    event.target.value = '';
    return;
  }

  const cat = parsed.categoria || currentTab;
  if (!CATEGORIES[cat]) {
    alert('Categoria inválida no arquivo.');
    event.target.value = '';
    return;
  }

  const itens = Array.isArray(parsed.itens) ? parsed.itens : [];
  const fields = CATEGORIES[cat].fields.map(f => f.key);
  const toCreate = itens
    .map(it => {
      const payload = {};
      fields.forEach(k => payload[k] = (it[k] ?? '').toString().trim());
      return payload;
    })
    .filter(it => it.titulo);

  if (!toCreate.length) {
    alert('Nenhum item válido com título foi encontrado.');
    event.target.value = '';
    return;
  }

  const updates = {};
  toCreate.forEach((it) => {
    const key = push(ref(db, `${dbPath}/${cat}`)).key;
    updates[`${dbPath}/${cat}/${key}`] = it;
  });
  await update(ref(db), updates);
  if (cat !== currentTab) switchTab(cat);
  alert(`${toCreate.length} item(ns) importado(s) em ${CATEGORIES[cat].label}.`);
  event.target.value = '';
};

onValue(ref(db, dbPath), (snap) => {
  const data = snap.val() || {};
  globalData = Object.fromEntries(Object.keys(CATEGORIES).map(k => [k, data[k] || {}]));
  renderTabs();
  renderCurrent();
});

onValue(ref(db, 'fichas_v3'), (snap) => {
  globalPlayers = snap.val() || {};
  if (currentTab === 'tecnicas') renderCurrent();
});
</script>
