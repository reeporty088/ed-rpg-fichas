<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay OBS V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }

        .overlay-wrap {
            width: 560px;
            height: 140px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            box-sizing: border-box;
        }

        .portrait {
            width: 125px;
            height: 125px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 14px rgba(0,0,0,0.7);
            position: relative;
            flex-shrink: 0;
            background: rgba(0,0,0,0.45);
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .info-layer {
            flex: 1;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .name-mode,
        .status-mode {
            width: 100%;
            color: #fff;
            text-transform: uppercase;
            text-shadow:
                2px 2px 0 #000,
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                0 0 12px rgba(0,0,0,0.85);
            transition: opacity 0.25s ease;
        }

        .name-mode.hidden,
        .status-mode.hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        .name-mode {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1;
            letter-spacing: 2px;
        }

        .name-main {
            font-size: 52px;
            font-weight: 800;
        }

        .name-sub {
            font-size: 32px;
            font-weight: 700;
            margin-top: 3px;
            opacity: 0.95;
        }

        .status-mode {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: 1fr 1fr;
            column-gap: 16px;
            align-items: center;
        }

        .stat-stress {
            grid-row: 1 / span 2;
            align-self: end;
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
            padding-bottom: 6px;
        }

        .stat-hp {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            align-self: end;
        }

        .stat-hope {
            font-size: 48px;
            font-weight: 800;
            line-height: 1;
            align-self: start;
        }

        .empty {
            color: #fff;
            font-size: 18px;
            text-transform: uppercase;
            padding: 12px;
            text-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>
    <div class="overlay-wrap" id="overlay-wrap">
        <div class="portrait"><img id="portrait-img" alt="Retrato"></div>
        <div class="info-layer">
            <div class="name-mode" id="name-mode">
                <div class="name-main" id="name-main">PERSONAGEM</div>
                <div class="name-sub" id="name-sub"></div>
            </div>
            <div class="status-mode hidden" id="status-mode">
                <div class="stat-stress" id="stat-stress">0/0</div>
                <div class="stat-hp" id="stat-hp">0/0</div>
                <div class="stat-hope" id="stat-hope">0/0</div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCvxxwfsonP5a45nbcz34cxYhXaWBZVhwQ",
        authDomain: "ed-rpg---sistema-de-fichas.firebaseapp.com",
        databaseURL: "https://ed-rpg---sistema-de-fichas-default-rtdb.firebaseio.com",
        projectId: "ed-rpg---sistema-de-fichas",
        storageBucket: "ed-rpg---sistema-de-fichas.firebasestorage.app",
        messagingSenderId: "350999444010",
        appId: "1:350999444010:web:d89f31d13e449b8fbfa153"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const params = new URLSearchParams(window.location.search);
    const fichaID = params.get('p') || 'personagem_padrao_v2';

    const nameModeEl = document.getElementById('name-mode');
    const statusModeEl = document.getElementById('status-mode');

    function splitName(rawName) {
        const parts = String(rawName || 'Personagem').trim().split(/\s+/).filter(Boolean);
        if (parts.length <= 1) return { first: parts[0] || 'Personagem', rest: '' };
        return { first: parts[0], rest: parts.slice(1).join(' ') };
    }

    function getOverlayImage(data) {
        const toggles = data.toggles || {};
        const hasDadivaAtiva = Object.values(toggles.dadivas_ativas || {}).some((isOn) => isOn === true);
        const hasFormaAtiva = !!toggles.forma_ativa;

        if (hasDadivaAtiva && data.overlay_img_dadiva) return data.overlay_img_dadiva;
        if (hasFormaAtiva && data.overlay_img_linhagem) return data.overlay_img_linhagem;
        return data.overlay_img || data.char_img || '';
    }

    function renderOverlay(data) {
        const { first, rest } = splitName(data.char_name || fichaID);
        document.getElementById('name-main').textContent = first;
        document.getElementById('name-sub').textContent = rest;

        const hpAt = parseInt(data.hp_at) || 0;
        const hpMax = parseInt(data.hp_max) || 0;
        const hopeAt = parseInt(data.hope_at) || 0;
        const hopeMax = parseInt(data.hope_max) || 0;
        const stressAt = parseInt(data.stress_at) || 0;
        const stressMax = parseInt(data.stress_max) || 0;

        document.getElementById('stat-hp').textContent = `${hpAt}/${hpMax}`;
        document.getElementById('stat-hope').textContent = `${hopeAt}/${hopeMax}`;
        document.getElementById('stat-stress').textContent = `${stressAt}/${stressMax}`;

        const mode = data.overlay_mode === 'status' ? 'status' : 'nome';
        nameModeEl.classList.toggle('hidden', mode !== 'nome');
        statusModeEl.classList.toggle('hidden', mode !== 'status');

        const img = getOverlayImage(data);
        document.getElementById('portrait-img').src = img || '';
    }

    onValue(ref(db, `fichas_v2/${fichaID}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            document.body.innerHTML = `<div class="empty">Ficha não encontrada: ${fichaID}</div>`;
            return;
        }
        renderOverlay(data);
    });
</script>
</body>
</html>
