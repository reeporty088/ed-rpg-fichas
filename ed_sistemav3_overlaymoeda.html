<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Moeda V3</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            color: #fff;
        }
        .overlay-moeda {
            padding: 12px 18px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-shadow: 2px 2px 8px rgba(0,0,0,.85);
            text-transform: uppercase;
            font-weight: bold;
        }
        .overlay-title {
            font-size: 34px;
            letter-spacing: 2px;
        }
        .overlay-value {
            font-size: 52px;
            line-height: 1;
        }
    </style>
</head>
<body data-require-auth="false">
    <div class="overlay-moeda">
        <div class="overlay-title">MOEDA</div>
        <div class="overlay-value" id="moeda_value">0</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, onValue, ref } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCvxxwfsonP5a45nbcz34cxYhXaWBZVhwQ",
        authDomain: "ed-rpg---sistema-de-fichas.firebaseapp.com",
        databaseURL: "https://ed-rpg---sistema-de-fichas-default-rtdb.firebaseio.com",
        projectId: "ed-rpg---sistema-de-fichas",
        storageBucket: "ed-rpg---sistema-de-fichas.firebasestorage.app",
        messagingSenderId: "350999444010",
        appId: "1:350999444010:web:d89f31d13e449b8fbfa153"
    };

    const db = getDatabase(initializeApp(firebaseConfig));

    onValue(ref(db, 'moeda_v3/valor'), (snapshot) => {
        const valor = Number(snapshot.val()) || 0;
        document.getElementById('moeda_value').innerText = String(valor);
    });
</script>
</body>
</html>
