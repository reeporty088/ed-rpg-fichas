<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil — ED</title><script src="auth.js"></script><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Raleway:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#070707;color:#f0e6e6;font-family:Raleway,sans-serif}.wrap{max-width:850px;margin:auto;padding:28px 16px}.card{background:#130909;border:1px solid #5c1c22;border-radius:16px;padding:22px;margin:16px 0}h1,h2{font-family:Cinzel,serif}.grid{display:grid;grid-template-columns:220px 1fr;gap:18px}.avatar{width:180px;height:180px;border-radius:18px;border:2px solid #5c1c22;background:#1b0d0d center/cover;display:grid;place-items:center;font-size:4rem}input{width:100%;padding:11px;border-radius:9px;border:1px solid #5c1c22;background:#080303;color:#f0e6e6;margin:6px 0 12px}.btn{display:inline-flex;padding:10px 14px;border-radius:10px;border:1px solid #9b1a1a;background:#241010;color:#ffd4d4;text-decoration:none;font-weight:700;cursor:pointer;margin:4px}.msg{color:#7fe8a8;min-height:22px}@media(max-width:700px){.grid{grid-template-columns:1fr}.avatar{width:100%;height:240px}}</style></head><body data-require-auth="true"><div class="wrap"><a class="btn" href="index.html">← Hub</a><h1>Perfil de usuário</h1><div class="card grid"><div><div id="avatar" class="avatar">👤</div><input id="avatarFile" type="file" accept="image/*"></div><div><h2>Dados da conta</h2><label>Nome da conta</label><input id="name"><button class="btn" onclick="saveProfile()">Salvar perfil</button><h2>Solicitações ao ADM</h2><label>Novo e-mail</label><input id="newEmail" type="email"><button class="btn" onclick="requestChange('email')">Solicitar troca de e-mail</button><label>Nova senha</label><input id="newPass" type="password"><button class="btn" onclick="requestChange('password')">Solicitar troca de senha</button><div id="msg" class="msg"></div></div></div></div><script>let avatarData='';function render(){const u=EDAuth.currentUser();if(!u)return;document.getElementById('name').value=u.name||'';avatarData=u.avatar||'';document.getElementById('avatar').style.backgroundImage=avatarData?`url('${avatarData}')`:'';document.getElementById('avatar').textContent=avatarData?'':'👤'}document.getElementById('avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{avatarData=x.target.result;renderPreview()};r.readAsDataURL(f)};function renderPreview(){document.getElementById('avatar').style.backgroundImage=`url('${avatarData}')`;document.getElementById('avatar').textContent=''}function saveProfile(){const r=EDAuth.updateCurrentProfile({name:document.getElementById('name').value,avatar:avatarData});document.getElementById('msg').textContent=r.ok?'Perfil salvo.':r.error}function requestChange(k){const v=k==='email'?document.getElementById('newEmail').value:document.getElementById('newPass').value;const r=EDAuth.requestCredentialChange(k,v);document.getElementById('msg').textContent=r.ok?'Solicitação enviada ao ADM.':r.error}render();</script></body></html>
