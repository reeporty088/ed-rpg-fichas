<head>

  <style>
    :root { --bg:#0a0a0a; --text:#eee4d5; --main:#7a1a1a; --light:#e8a090; --card:#1a0a08; --border:#4a1a18; --input:#120605; }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
    h1 { text-align:center; color:var(--light); margin:0 0 16px; text-transform:uppercase; letter-spacing:2px; }
    .container { max-width:1280px; margin:0 auto; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .tab-btn { background:#1b1110; border:1px solid var(--border); color:#bda7a4; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:700; }
    .tab-btn.active { background:var(--main); color:#fff; border-color:var(--light); }
    .card { background:linear-gradient(160deg,var(--card),#0d0604); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .btn { border:1px solid var(--border); background:#1f1413; color:#f2d9d3; border-radius:7px; padding:8px 12px; cursor:pointer; font-weight:700; }
    .btn:hover { border-color:var(--light); }
    .btn-add { background:#1b4d2f; border-color:#2f7a4e; color:#b6efc7; }
    .btn-warn { background:#66460d; border-color:#9b7433; color:#ffe5af; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
    .item { background:rgba(0,0,0,.3); border:1px solid #37201e; border-radius:10px; padding:10px; }
    .item h4 { margin:0 0 6px; color:var(--light); }
    .meta { font-size:12px; color:#bca8a5; margin-bottom:6px; }
    .desc { white-space:pre-wrap; font-size:13px; color:#d6c8c4; line-height:1.4; }
    .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
    .btn-edit { background:#66460d; border-color:#9b7433; color:#ffe5af; }
    .btn-del { background:#5a1515; border-color:#8a2525; color:#ffc3c3; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); align-items:center; justify-content:center; padding:16px; }
    .modal.open { display:flex; }
    .box { width:min(820px,100%); max-height:90vh; overflow-y:auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label { font-size:11px; font-weight:700; color:var(--light); text-transform:uppercase; margin:8px 0 4px; display:block; }
    input, textarea, select { width:100%; border-radius:7px; border:1px solid #3a2422; background:var(--input); color:var(--text); padding:8px; }
    textarea { min-height:80px; resize:vertical; }
    .hidden { display:none; }
    .hint { font-size:12px; color:#c9b2ae; }
    .logic-layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:12px; }
    .logic-canvas { position:relative; height:75vh; min-height:640px; overflow:auto; border:1px solid var(--border); border-radius:12px; background:radial-gradient(circle at top,#160b0a,#050303 58%); cursor: grab; touch-action: none; }
    .logic-canvas:active { cursor: grabbing; }
    .logic-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .logic-node { position:absolute; width:172px; min-height:86px; border:1px solid #70403c; border-radius:12px; background:linear-gradient(160deg,#21100e,#0c0504); padding:10px; cursor:move; box-shadow:0 10px 24px #0009; user-select:none; touch-action: none; }
    .logic-node.selected { border-color:var(--light); box-shadow:0 0 0 2px #e8a09033,0 10px 24px #0009; }
    .logic-node.final { border-color:#61b36f; }
    .logic-node.start { border-color:#78b9ff; }
    .logic-node-title { color:var(--light); font-weight:800; font-size:13px; margin-bottom:5px; }
    .logic-node-meta { color:#9ebbd4; font-size:11px; }
    .logic-node-desc { color:#bca8a5; font-size:11px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .logic-side { border:1px solid var(--border); border-radius:12px; padding:12px; background:#090404; align-self:start; }
    .logic-help { color:#c9b2ae; font-size:12px; line-height:1.45; margin-bottom:10px; }
    .logic-edges { display:flex; flex-direction:column; gap:7px; margin-top:8px; }
    .logic-edge-row { display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; }
    .logic-node-actions { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    @media (max-width:900px){ .logic-layout{grid-template-columns:1fr;} .logic-side{order:-1;} }

function calcTecnicaCustoDB() {
  const alcance = document.getElementById('f_alcance')?.value || '';
  const area    = document.getElementById('f_area')?.value    || '';
  const dados   = document.getElementById('f_dados')?.value   || '';

let selectedLogicNode = 'start';

let draggingLogicNode = null;

let isPanning = false;
let panStart = { x: 0, y: 0, scrollLeft: 0, scrollTop: 0 };
let zoomLevel = 1.0;

window.handleCanvasWheel = (e) => {
  e.preventDefault();
  const canvas = document.getElementById('logic_canvas');
  if (!canvas) return;

  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left + canvas.scrollLeft;
  const mouseY = e.clientY - rect.top + canvas.scrollTop;

  const oldZoom = zoomLevel;
  zoomLevel = Math.max(0.15, Math.min(2.5, zoomLevel + e.deltaY * -0.001));

  const workspace = document.getElementById('logic_workspace');
  if (workspace) {
    workspace.style.transform = `scale(${zoomLevel})`;

    const scaleRatio = zoomLevel / oldZoom;
    canvas.scrollLeft = mouseX * scaleRatio - (e.clientX - rect.left);
    canvas.scrollTop = mouseY * scaleRatio - (e.clientY - rect.top);
  }
};

window.startCanvasPan = (e) => {
  if (e.button !== 0) return;
  if (e.target.closest('.logic-node')) return;
  isPanning = true;
  const canvas = document.getElementById('logic_canvas');
  if (canvas) {
    panStart = {
      x: e.clientX,
      y: e.clientY,
      scrollLeft: canvas.scrollLeft,
      scrollTop: canvas.scrollTop
    };
    canvas.setPointerCapture(e.pointerId);
  }
};

window.handleCanvasPointerMove = (e) => {
  if (draggingLogicNode) {
    window.dragLogicMove(e);
  } else if (isPanning) {
    const canvas = document.getElementById('logic_canvas');
    if (canvas) {
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      canvas.scrollLeft = panStart.scrollLeft - dx;
      canvas.scrollTop = panStart.scrollTop - dy;
    }
  }
};

window.endCanvasPan = (e) => {
  if (isPanning) {
    isPanning = false;
    const canvas = document.getElementById('logic_canvas');
    if (canvas) {
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch(err) {}
    }
  }
  if (draggingLogicNode) {
    window.finishLogicDrag(e);
  }
};

window.selectLogicNode = (id) => {
  if (draggingLogicNode) return;
  if (connectFromNode && connectFromNode !== id) {
    const k = push(ref(db, `${dbPath}/logica_tecnicas/edges`)).key;
    update(ref(db, `${dbPath}/logica_tecnicas/edges/${k}`), { from: connectFromNode, to: id });
    connectFromNode = '';
  }
  selectedLogicNode = id;
  renderCurrent();
};
window.startLogicDrag = (event, id) => {
  if (event.button !== 0) return;
  selectedLogicNode = id;
  const { nodes } = logicData();
  const n = nodes[id] || {};
  draggingLogicNode = { id, startX: event.clientX, startY: event.clientY, x: Number(n.x) || 0, y: Number(n.y) || 0, moved: false };
  event.currentTarget.setPointerCapture?.(event.pointerId);
};
window.dragLogicMove = (event) => {
  if (!draggingLogicNode) return;
  const dx = (event.clientX - draggingLogicNode.startX) / zoomLevel;
  const dy = (event.clientY - draggingLogicNode.startY) / zoomLevel;
  if (Math.abs(event.clientX - draggingLogicNode.startX) + Math.abs(event.clientY - draggingLogicNode.startY) > 3) {
    draggingLogicNode.moved = true;
  }
  const x = Math.max(0, draggingLogicNode.x + dx);
  const y = Math.max(0, draggingLogicNode.y + dy);
  const nodeEl = document.querySelector(`.logic-node[data-node-id="${CSS.escape(draggingLogicNode.id)}"]`);
  if (nodeEl) { nodeEl.style.left = `${x}px`; nodeEl.style.top = `${y}px`; }
};
window.finishLogicDrag = (event) => {
  if (!draggingLogicNode) return;
  const d = draggingLogicNode;
  draggingLogicNode = null;
  if (!d.moved) return;
  const clientX = event?.clientX ?? d.startX;
  const clientY = event?.clientY ?? d.startY;
  const dx = (clientX - d.startX) / zoomLevel;
  const dy = (clientY - d.startY) / zoomLevel;
  const x = Math.max(0, d.x + dx);
  const y = Math.max(0, d.y + dy);
  update(ref(db, `${dbPath}/logica_tecnicas/nodes/${d.id}`), { x, y });
};
window.addLogicNode = () => {
  const { nodes } = logicData();
  const parent = nodes[selectedLogicNode] || nodes.start || { x: 40, y: 40 };
  const k = push(ref(db, `${dbPath}/logica_tecnicas/nodes`)).key;
  const e = push(ref(db, `${dbPath}/logica_tecnicas/edges`)).key;
  update(ref(db), {
    [`${dbPath}/logica_tecnicas/nodes/${k}`]: { nome: 'Novo bloco', desc: '', custo_pm: 0, final: false, x: (Number(parent.x)||40)+230, y: (Number(parent.y)||40)+40 },
    [`${dbPath}/logica_tecnicas/edges/${e}`]: { from: selectedLogicNode || 'start', to: k }
  });
  selectedLogicNode = k;
};
window.addLogicFinalNode = () => {
  const { nodes } = logicData();
  const parent = nodes[selectedLogicNode] || nodes.start || { x: 40, y: 40 };
  const k = push(ref(db, `${dbPath}/logica_tecnicas/nodes`)).key;

window.deleteLogicNode = async () => {
  if (selectedLogicNode === 'start') return;
  if (!confirm('Deletar este bloco e todas as setas ligadas a ele?')) return;
  const { edges } = logicData();
  const updates = { [`${dbPath}/logica_tecnicas/nodes/${selectedLogicNode}`]: null };
  Object.entries(edges).forEach(([id, e]) => {
    if (e.from === selectedLogicNode || e.to === selectedLogicNode) updates[`${dbPath}/logica_tecnicas/edges/${id}`] = null;
  });
  selectedLogicNode = 'start';
  await update(ref(db), updates);
};

      <textarea id="f_desc" placeholder="Escreva os detalhes e efeitos da técnica...">${esc(item.desc || '')}</textarea>

      <div style="margin-top:12px; background:rgba(0,0,0,0.3); border:1px solid var(--border); padding:12px; border-radius:10px;">
        <label>Imagem da Técnica (Ilustração / Fundo)</label>
        <input type="file" id="f_imagem_file" accept="image/*" onchange="handleTechV4ImageUpload(event)" style="margin-bottom:6px;">
        <input id="f_imagem" type="text" placeholder="URL da imagem (ou selecione arquivo acima)" value="${esc(item.imagem || '')}" onchange="updateTechV4PreviewImg()">
        <div id="f_imagem_preview" style="margin-top:8px; height:120px; border-radius:8px; border:1px solid var(--border); background-size:cover; background-position:center; display:${item.imagem ? 'block' : 'none'}; background-image:url('${item.imagem || ''}');"></div>
      </div>
    </div>`;
}

function renderTecnicasV4Compendium() {
  const items = Object.entries(globalData.tecnicas_v4 || {})
    .map(([id, v]) => ({ id, ...(v || {}) }))
    .sort((a,b) => (a.titulo || '').localeCompare(b.titulo || ''));

  if (!items.length) {
    return '<div style="opacity:.65">Nenhuma técnica v4 cadastrada no compêndio.</div>';
  }

  return '<div class="grid">' + items.map(it => {
    const bgStyle = it.imagem ? `background-image: linear-gradient(180deg, rgba(13,6,4,0.85) 0%, rgba(13,6,4,0.96) 100%), url('${it.imagem.replace(/'/g, "%27")}'); background-size: cover; background-position: center;` : '';
    const type = it.tipo || 'Física';
    return `
      <div class="tech-v4-card" style="${bgStyle}">
        <div class="tech-v4-header">
          <span class="tech-v4-type-badge ${type}">${type}</span>
          <h3 style="margin:0; font-family:'Cinzel',serif; color:var(--light); font-size:1.1rem; flex-grow:1;">${esc(it.titulo || it.id)}</h3>
          <span class="tech-v4-cost-badge">${esc(it.custo_pm || it.custo || 0)} PM</span>
        </div>
        <div class="tech-v4-body">
          ${it.alcance ? `<div><b>Alcance:</b> ${esc(it.alcance)}</div>` : ''}
          ${it.teste ? `<div><b>Teste:</b> ${esc(it.teste)}</div>` : ''}
          ${it.exigencias ? `<div><b>Exigências:</b> ${esc(it.exigencias)}</div>` : ''}
          ${it.foco_arcano ? `<div><b>Foco Arcano:</b> ${esc(it.foco_arcano)}</div>` : ''}
          ${it.conexao_divina ? `<div><b>Conexão Divina:</b> ⚡ ${esc(it.conexao_divina)}</div>` : ''}
          <div style="margin-top:6px; white-space:pre-wrap;">${esc(it.desc || '')}</div>
        </div>
        <div class="actions">
          <button class="btn btn-edit" onclick="openForm('tecnicas_v4','${it.id}')">Editar</button>
          <button class="btn btn-del" onclick="deleteItem('tecnicas_v4','${it.id}')">Excluir</button>
        </div>
      </div>`;
  }).join('') + '</div>';
}

function renderCurrent(){
  const cfg = CATEGORIES[currentTab];
  document.getElementById('sec_title').innerText = cfg.label;
  const list = document.getElementById('list_current');

  if (currentTab === 'tecnicas_v4') {
    document.getElementById('btn_area_novo').innerHTML = '<button class="btn btn-add" onclick="openForm(\'tecnicas_v4\')">+ Nova Técnica v4</button>';
    list.className = '';
    list.style.cssText = '';
    list.innerHTML = renderTecnicasV4Compendium();
    return;
  }

  document.getElementById('btn_area_novo').innerHTML = '<button class="btn btn-add" onclick="openCurrentTabForm()">+ Novo Item</button>';
  list.className = 'grid';
  const arr = Object.entries(globalData[currentTab] || {})
    .map(([id, v]) => ({ id, ...(v || {}) }))
    .sort((a,b) => (a.titulo || '').localeCompare(b.titulo || ''));

  if (!arr.length) {
    list.innerHTML = '<div style="opacity:.65">Nenhum registro nessa categoria.</div>';
    return;
  }

  list.innerHTML = arr.map(it => `
    <div class="item">
      <h4>${esc(it.titulo || it.id)}</h4>
      <div class="meta">${esc(cfg.meta(it))}</div>
      <div class="desc">${esc(it[cfg.descField] || '')}</div>
      <div class="actions">
        <button class="btn btn-edit" onclick="openForm('${currentTab}','${it.id}')">Editar</button>
        <button class="btn btn-del" onclick="deleteItem('${currentTab}','${it.id}')">Excluir</button>
      </div>
    </div>
  `).join('');
}

function buildFields(cat, data = {}, forceText = false){
  const cfg = CATEGORIES[cat];
  return cfg.fields.map(f => {
    const value = data[f.key] ?? '';
    if (f.type === 'textarea') {
      return `<label>${f.label}${f.required?' *':''}</label><textarea id="f_${f.key}" data-key="${f.key}">${esc(value)}</textarea>`;
    }
    if (f.type === 'select' && !forceText) {
      const opts = f.options.map(o => `<option value="${esc(o)}" ${value === o ? 'selected' : ''}>${esc(o)}</option>`).join('');
      return `<label>${f.label}${f.required?' *':''}</label><select id="f_${f.key}" data-key="${f.key}"><option value="">-- Selecionar --</option>${opts}</select>`;
    }
    return `<label>${f.label}${f.required?' *':''}</label><input id="f_${f.key}" data-key="${f.key}" type="text" value="${esc(value)}" placeholder="${esc(f.label)}" />`;
  }).join('');
}

window.switchTab = (tab) => { currentTab = tab; renderTabs(); renderCurrent(); };
window.openCurrentTabForm = () => window.openForm(currentTab);
window.openTecnicaForm = (mode) => { tecnicaFormMode = mode; window.openForm('tecnicas'); };
window.openTecnicaV2Creator = () => { window.location.href = 'ed_sistemav4_criadordetecnicas.html?source=compendium'; };

window.openForm = (cat, id='') => {
  const item = id ? (globalData[cat] || {})[id] || {} : {};
  document.getElementById('editId').value = id;
  document.getElementById('modal').dataset.category = cat;

  if (cat === 'tecnicas_v4') {
    selectedTechV4Type = item.tipo || '';
    document.getElementById('modalTitle').innerText = `${id ? 'Editar' : 'Criar'} Técnica v4`;
    renderTechV4Form(id);
    document.getElementById('modal').classList.add('open');
    return;
  }

  document.getElementById('modalTitle').innerText = `${id ? 'Editar' : 'Criar'} ${CATEGORIES[cat].label}`;
  document.getElementById('dynamicFields').innerHTML = buildFields(cat, item);
  document.getElementById('modal').classList.add('open');
};
window.closeForm = () => document.getElementById('modal').classList.remove('open');

function collectFormData(cat){
  const cfg = CATEGORIES[cat];
  const out = {};
  for (const f of cfg.fields) {
    const val = (document.getElementById(`f_${f.key}`)?.value || '').trim();
    if (f.required && !val) throw new Error(`Campo obrigatório: ${f.label}`);
    out[f.key] = val;
  }
  return out;
}

window.saveItem = async () => {
  const cat = document.getElementById('modal').dataset.category;
  const id = document.getElementById('editId').value;
  let payload;

  if (cat === 'tecnicas_v4') {
    const titulo = document.getElementById('f_titulo')?.value.trim();
    if (!titulo) { alert('Nome da técnica é obrigatório.'); return; }
    const type = selectedTechV4Type || 'Física';
    payload = {
      titulo,
      tipo: type,
      subtipo: document.getElementById('f_subtipo')?.value.trim() || '',
      alcance: document.getElementById('f_alcance')?.value.trim() || '',
      teste: document.getElementById('f_teste')?.value.trim() || '',
      exigencias: document.getElementById('f_exigencias')?.value.trim() || '',
      custo_pm: parseInt(document.getElementById('f_custo_pm')?.value) || 0,
      desc: document.getElementById('f_desc')?.value.trim() || '',
      imagem: document.getElementById('f_imagem')?.value || ''
    };
    if (document.getElementById('f_foco_arcano')) {
      payload.foco_arcano = document.getElementById('f_foco_arcano')?.value.trim() || '';
    } else if (type === 'Feitiço') {
      payload.foco_arcano = document.getElementById('f_foco_arcano')?.value.trim() || '';
    }
    if (document.getElementById('f_conexao_divina')) {
      payload.conexao_divina = document.getElementById('f_conexao_divina')?.value || '';
    } else if (type === 'Clamor') {
      payload.conexao_divina = document.getElementById('f_conexao_divina')?.value || '';
    }
  } else {
    try { payload = collectFormData(cat); } catch (err) { alert(err.message); return; }
  }

  if (id) await update(ref(db, `${dbPath}/${cat}/${id}`), payload);
  else {
    const k = push(ref(db, `${dbPath}/${cat}`)).key;
    await update(ref(db, `${dbPath}/${cat}/${k}`), payload);
  }
  closeForm();
};

window.deleteItem = async (cat, id) => {
  if (!confirm('Excluir este item do banco?')) return;
  await remove(ref(db, `${dbPath}/${cat}/${id}`));
};

window.savePlayerTechToCompendium = async (fichaId, techId) => {
  const tech = globalPlayers[fichaId]?.habilidades?.tecnicas?.[techId];
  if (!tech) return;
  const payload = {
    titulo:   tech.titulo   || '',
    caminho:  tech.caminho  || '',
    pericia:  tech.pericia  || '',
    custo_pm: tech.custo_pm || '',
    alcance:  tech.alcance  || '',
    area:     tech.area     || '',
    dados:    tech.dados    || '',
    duracao:  tech.duracao  || '',
    desc:     tech.desc     || ''
  };
  const k = push(ref(db, `${dbPath}/tecnicas`)).key;
  await update(ref(db, `${dbPath}/tecnicas/${k}`), payload);
  alert('Técnica salva no Compêndio!');
};

window.deletePlayerTech = async (fichaId, techId) => {
  if (!confirm('Excluir esta técnica da ficha do jogador?')) return;
  await remove(ref(db, `fichas_v4/${fichaId}/habilidades/tecnicas/${techId}`));
};

function makeTemplate(cat){
  const fields = CATEGORIES[cat].fields.map(f => f.key);
  const model = {};
  fields.forEach((k) => model[k] = '');
  return { categoria: cat, instrucoes: 'Preencha os objetos em itens. Apenas itens com titulo serão importados.', itens: [model] };
}

window.downloadTemplate = (format='json') => {
  const model = makeTemplate(currentTab);
  let content = '';
  let filename = `modelo_${currentTab}.${format}`;
  if (format === 'json') {
    content = JSON.stringify(model, null, 2);
  } else {
    const keys = Object.keys(model.itens[0]);
    content = [
      `# MODELO ${currentTab.toUpperCase()}`,
      '# Use blocos separados por ---',
      ...keys.map(k => `${k}: `),
      '---',
      ...keys.map(k => `${k}: `)
    ].join('\n');
  }
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
};

function parseTxtImport(raw){
  const blocks = raw.split(/\n\s*---\s*\n/g).map(b => b.trim()).filter(Boolean);
  const items = blocks.map(block => {
    const obj = {};
    block.split('\n').forEach(line => {
      if (!line.includes(':')) return;
      const [k, ...rest] = line.split(':');
      obj[k.trim()] = rest.join(':').trim();
    });
    return obj;
  });
  return { categoria: currentTab, itens: items };
}

window.importItems = async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  const text = await file.text();
  let parsed;
  try {
    parsed = file.name.toLowerCase().endsWith('.json') ? JSON.parse(text) : parseTxtImport(text);
  } catch {
    alert('Arquivo inválido. Use o modelo de importação.');
    event.target.value = '';
    return;
  }

  const cat = parsed.categoria || currentTab;
  if (!CATEGORIES[cat]) {
    alert('Categoria inválida no arquivo.');
    event.target.value = '';
    return;
  }

  const itens = Array.isArray(parsed.itens) ? parsed.itens : [];
  const fields = CATEGORIES[cat].fields.map(f => f.key);
  const toCreate = itens
    .map(it => {
      const payload = {};
      fields.forEach(k => payload[k] = (it[k] ?? '').toString().trim());
      return payload;
    })
    .filter(it => it.titulo);

  if (!toCreate.length) {
    alert('Nenhum item válido com título foi encontrado.');
    event.target.value = '';
    return;
  }

  const updates = {};
  toCreate.forEach((it) => {
    const key = push(ref(db, `${dbPath}/${cat}`)).key;
    updates[`${dbPath}/${cat}/${key}`] = it;
  });
  await update(ref(db), updates);
  if (cat !== currentTab) switchTab(cat);
  alert(`${toCreate.length} item(ns) importado(s) em ${CATEGORIES[cat].label}.`);
  event.target.value = '';
};

onValue(ref(db, dbPath), (snap) => {
  const data = snap.val() || {};
  globalData = Object.fromEntries(Object.keys(CATEGORIES).map(k => [k, data[k] || {}]));
  renderTabs();
  renderCurrent();
});

onValue(ref(db, 'fichas_v4'), (snap) => {
  globalPlayers = snap.val() || {};
  if (currentTab === 'tecnicas') renderCurrent();
});

window.toggleSidebar = () => {
  const nav = document.getElementById('sidebarNav');
  const backdrop = document.querySelector('.sidebar-backdrop');
  if (nav && backdrop) {
    nav.classList.toggle('open');
    backdrop.classList.toggle('open');
  }
};

window.handleLogout = () => {
  if (window.EDAuth) window.EDAuth.logout();
  window.location.href = '../index.html';
};

document.addEventListener('DOMContentLoaded', () => {
  if (window.EDAuth) {
    const u = window.EDAuth.currentUser();
    if (u) {
      const sideUserName = document.getElementById('sideUserName');
      if (sideUserName) sideUserName.textContent = u.name;
      const sideAv = document.getElementById('sideAvatar');
      if (sideAv) {
        if (u.photo) {
          sideAv.style.backgroundImage = `url(${u.photo})`;
          sideAv.textContent = '';
        } else {
          sideAv.textContent = u.role === 'admin' ? '👑' : '⚔';
        }
      }
      if (u.role === 'admin') {
        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
      }
    }
  }
});
