<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário</title>
    <style>
        :root { 
            --bg: #121212; 
            --panel: #1e1e1e;
            --highlight: #800000; 
            --text: #e0e0e0;
            --accent: #ffaaaa;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', serif; padding: 20px; text-align: center; }
        
        .header-panel {
            background: var(--panel);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #333;
            max-width: 800px;
            margin: 0 auto 30px auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .date-display {
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(128, 0, 0, 0.5);
        }

        .time-display {
            font-size: 24px;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        button:hover { background: var(--highlight); border-color: var(--accent); }
        button.primary { background: var(--highlight); border: 1px solid var(--accent); }
        
        /* Botões de Edição Especiais */
        .btn-edit { border: 1px solid #00ffff; color: #00ffff; }
        .btn-edit:hover { background: rgba(0, 255, 255, 0.2); }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .day-card {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 5px;
            position: relative;
            opacity: 0.6;
            transition: 0.3s;
        }

        .day-card.active {
            opacity: 1;
            transform: scale(1.1);
            border: 2px solid var(--accent);
            background: #2a0a0d;
            box-shadow: 0 0 15px var(--highlight);
            z-index: 10;
        }

        .day-number { font-size: 18px; font-weight: bold; margin-bottom: 5px; display: block; }
        .moon-icon { font-size: 20px; display: block; margin: 5px 0; }
        .blood-moon { color: #ff0000; text-shadow: 0 0 8px red; }
        
        .weather-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 2px;
            margin-top: 5px;
        }

        .period-indicator {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }
        .day-card.active .period-indicator { display: flex; }

        .sidebar-trigger {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1900;
            background: #0f1c24;
            border: 1px solid #1a4c5c;
            color: #7fe3ff;
            border-radius: 6px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }
        .sidebar-trigger:hover {
            border-color: #2accda;
            color: #2accda;
        }
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1999;
            backdrop-filter: blur(2px);
        }
        .sidebar-backdrop.open { display: block; }
        .sidebar-nav {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: rgba(9, 19, 25, 0.98);
            border-right: 1px solid #1a4c5c;
            box-shadow: 5px 0 25px rgba(0,0,0,0.85);
            z-index: 2000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 24px;
            text-align: left;
        }
        .sidebar-nav.open { left: 0; }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(26,76,92,0.4);
            margin-bottom: 20px;
        }
        .sidebar-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a4c5c, #0a1c24);
            border: 2px solid #2accda;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .sidebar-user-name {
            font-family: 'Cinzel', serif, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: #7fe3ff;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            padding: 0;
            margin: 0;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #78a8b8;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(42,204,218,0.15);
            color: #fff;
            border-left: 3px solid #2accda;
        }
        .sidebar-footer {
            padding-top: 15px;
            border-top: 1px solid rgba(26,76,92,0.4);
        }
    </style>
    <script src="../configs/auth.js"></script>
    <link rel="manifest" href="../configs/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ED RPG" />
</head>
<body data-require-auth="true" data-required-version="v4">

  <!-- Sidebar Trigger -->
  <div class="sidebar-trigger" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar Backdrop -->
  <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <!-- Sidebar Navigation -->
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="sidebar-header">
      <div class="sidebar-avatar" id="sideAvatar">⚔</div>
      <div class="sidebar-user-name" id="sideUserName">Jogador</div>
    </div>
    <ul class="sidebar-menu">
      <li><a class="sidebar-link" href="../index.html">🏠 Hub</a></li>
      <li><a class="sidebar-link" href="../perfil.html">👤 Perfil</a></li>
      <li><a class="sidebar-link" href="../index.html?tab=fichas">🎭 Fichas</a></li>
      <li class="admin-only hidden"><a class="sidebar-link" href="ed_sistemav4_mestre.html">👑 Painel do Mestre</a></li>
      <li class="admin-only hidden"><a class="sidebar-link" href="../index.html?tab=users">👥 Gerenciar Usuários</a></li>
      <li class="admin-only hidden"><a class="sidebar-link active" href="ed_sistemav4_calendario.html">📅 Calendário</a></li>
      <li class="admin-only hidden"><a class="sidebar-link" href="../index.html?tab=notifications">🔔 Notificações</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-link" onclick="handleLogout()">🚪 Sair</div>
    </div>
  </nav>

    <div class="header-panel">
        <div class="date-display" id="full_date">CARREGANDO...</div>
        
        <div class="time-display">
            <span id="period_icon">☀</span> 
            <span id="period_text">Manhã</span>
            <span style="font-size:16px; opacity:0.5;">|</span>
            <span id="clock_time">08:00</span>
        </div>

        <div class="controls">
            <button onclick="window.changeClock(-30)">-30 min</button>
            <button onclick="window.changeClock(30)">+30 min</button>
            <div style="width:20px;"></div>
            <button class="primary" onclick="window.advancePeriod()">Avançar Período ⏩</button>
        </div>
        
        <div class="controls" style="margin-top:10px; border-top:1px solid #444; padding-top:10px;">
            <span style="font-size:12px; color:#666; align-self:center;">ADMIN:</span>
            <button onclick="window.adminChangeDay(-1)">Voltar Dia</button>
            <button onclick="window.adminChangeDay(1)">Avançar Dia</button>
            
            <div style="width:10px;"></div>
            
            <button class="btn-edit" onclick="window.setCustomDate()">✏️ Data</button>
            <button class="btn-edit" onclick="window.setCustomTime()">✏️ Hora</button>
        </div>
    </div>

    <div class="calendar-grid" id="calendar_grid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCvxxwfsonP5a45nbcz34cxYhXaWBZVhwQ",
        authDomain: "ed-rpg---sistema-de-fichas.firebaseapp.com",
        databaseURL: "https://ed-rpg---sistema-de-fichas-default-rtdb.firebaseio.com",
        projectId: "ed-rpg---sistema-de-fichas",
        storageBucket: "ed-rpg---sistema-de-fichas.firebasestorage.app",
        messagingSenderId: "350999444010",
        appId: "1:350999444010:web:d89f31d13e449b8fbfa153"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SEASONS = ["Primavera", "Verão", "Outono", "Inverno"];
    const DAYS_IN_SEASON = 90;
    const PERIODS = ["Manhã", "Tarde", "Noite"];
    const PERIOD_ICONS = ["🌅", "☀", "🌙"];
    const MOON_PHASES = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
    
    const WEATHER_TYPES = {
        "Primavera": ["☀", "⛅", "☁", "🌧", "⛈"],
        "Verão":     ["☀", "☀", "⛅", "⛈", "🌪"],
        "Outono":    ["☁", "🌧", "🌫", "🌬", "🍂"],
        "Inverno":   ["☁", "❄", "🌨", "🌬", "☃"]
    };

    function pseudoRandom(seed) {
        let x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
    }

    function getWeather(seasonIndex, day, periodIndex) {
        const seasonName = SEASONS[seasonIndex];
        const options = WEATHER_TYPES[seasonName];
        const seed = (seasonIndex * 1000) + (day * 10) + periodIndex; 
        const rand = Math.floor(pseudoRandom(seed) * options.length);
        return options[rand];
    }

    function getMoon(globalDayCount) {
        if (globalDayCount > 0 && globalDayCount % 28 === 0) {
            return { icon: "asd", isBlood: true };
        }
        const phaseIndex = globalDayCount % 8;
        return { icon: MOON_PHASES[phaseIndex], isBlood: false };
    }

    const worldRef = ref(db, 'world_time');

    onValue(worldRef, (snapshot) => {
        let data = snapshot.val();
        if (!data) {
            data = { year: 1200, season: 0, day: 1, period: 0, hour: 8, minute: 0 };
            update(worldRef, data);
        }
        renderInterface(data);
    });

    function renderInterface(data) {
        document.getElementById('full_date').innerText = `Anno ${data.year} - Período de ${SEASONS[data.season]}`;
        document.getElementById('period_text').innerText = PERIODS[data.period];
        document.getElementById('period_icon').innerText = PERIOD_ICONS[data.period];
        
        const h = data.hour.toString().padStart(2, '0');
        const m = data.minute.toString().padStart(2, '0');
        document.getElementById('clock_time').innerText = `${h}:${m}`;

        const grid = document.getElementById('calendar_grid');
        grid.innerHTML = "";

        for (let i = 1; i <= DAYS_IN_SEASON; i++) {
            const globalDays = (data.year * 360) + (data.season * 90) + i;
            const moon = getMoon(globalDays);
            const wMorning = getWeather(data.season, i, 0);
            const wAfter = getWeather(data.season, i, 1);
            const wNight = getWeather(data.season, i, 2);
            const isActive = (i === data.day);
            const moonHtml = moon.isBlood ? '<span class="moon-icon blood-moon">🔴</span>' : `<span class="moon-icon">${moon.icon}</span>`;

            const card = document.createElement('div');
            card.className = `day-card ${isActive ? 'active' : ''}`;
            card.innerHTML = `
                <span class="day-number">${i}</span>
                ${moonHtml}
                <div class="weather-row">
                    <span title="Manhã">${wMorning}</span>
                    <span title="Tarde">${wAfter}</span>
                    <span title="Noite">${wNight}</span>
                </div>
                <div class="period-indicator">${PERIOD_ICONS[data.period]}</div>
            `;
            
            grid.appendChild(card);
        }
    }

    // --- FUNÇÕES DE CONTROLE ---

    window.changeClock = (minutes) => {
        runTransaction(worldRef, (current) => {
            if (!current) return;
            let newMin = current.minute + minutes;
            let newHour = current.hour;
            while (newMin >= 60) { newMin -= 60; newHour++; }
            while (newMin < 0) { newMin += 60; newHour--; }
            if (newHour >= 24) newHour = 0;
            if (newHour < 0) newHour = 23;
            current.minute = newMin;
            current.hour = newHour;
            return current;
        });
    };

    window.advancePeriod = () => {
        runTransaction(worldRef, (current) => {
            if (!current) return;
            current.period++;
            
            // Avança hora junto
            if (current.period === 1) current.hour = 12; // Tarde
            if (current.period === 2) current.hour = 19; // Noite

            // Virada do Dia
            if (current.period > 2) {
                current.period = 0;
                current.hour = 8;
                current.day++;
                
                // --- LÓGICA DE VIRADA DE ESTAÇÃO CORRIGIDA ---
                if (current.day > DAYS_IN_SEASON) {
                    current.day = 1;
                    current.season++;
                    
                    if (current.season > 3) {
                        current.season = 0;
                        current.year++;
                    }
                }
            }
            return current;
        });
    };

    window.adminChangeDay = (amount) => {
        runTransaction(worldRef, (current) => {
            if (!current) return;
            current.day += amount;
            
            // --- LÓGICA DE VIRADA DE ESTAÇÃO MANUAL ---
            
            // Se passar de 90, vai para o dia 1 da próxima estação
            if (current.day > DAYS_IN_SEASON) {
                current.day = 1;
                current.season++;
                if (current.season > 3) {
                    current.season = 0;
                    current.year++;
                }
            } 
            // Se voltar antes do dia 1, vai para o dia 90 da estação anterior
            else if (current.day < 1) {
                current.day = DAYS_IN_SEASON;
                current.season--;
                if (current.season < 0) {
                    current.season = 3;
                    current.year--;
                }
            }

            return current;
        });
    };

    window.setCustomDate = () => {
        runTransaction(worldRef, (current) => {
            if (!current) return;
            
            const newYear = prompt("Digite o Anno:", current.year);
            if (newYear === null) return;
            
            const newDay = prompt(`Digite o Dia (1-${DAYS_IN_SEASON}):`, current.day);
            if (newDay === null) return;

            // Valida Estação também (opcional, mas bom pra controle)
            const newSeason = prompt(`Digite Estação (0=Pri, 1=Ver, 2=Out, 3=Inv):`, current.season);
            if (newSeason !== null) current.season = Math.min(Math.max(parseInt(newSeason)||0, 0), 3);

            current.year = parseInt(newYear) || current.year;
            let d = parseInt(newDay) || current.day;
            
            if(d < 1) d = 1;
            if(d > DAYS_IN_SEASON) d = DAYS_IN_SEASON;
            current.day = d;

            return current;
        });
    };

    // NOVA FUNÇÃO: Definir Hora Manualmente
    window.setCustomTime = () => {
        runTransaction(worldRef, (current) => {
            if (!current) return;
            
            const newH = prompt("Digite a Hora (0-23):", current.hour);
            if (newH === null) return;
            
            const newM = prompt("Digite os Minutos (0-59):", current.minute);
            if (newM === null) return;

            let h = parseInt(newH);
            let m = parseInt(newM);

            if (!isNaN(h)) current.hour = Math.min(Math.max(h, 0), 23);
            if (!isNaN(m)) current.minute = Math.min(Math.max(m, 0), 59);

            return current;
        });
    };

    window.toggleSidebar = () => {
        const nav = document.getElementById('sidebarNav');
        const backdrop = document.querySelector('.sidebar-backdrop');
        if (nav && backdrop) {
            nav.classList.toggle('open');
            backdrop.classList.toggle('open');
        }
    };

    window.handleLogout = () => {
        if (window.EDAuth) window.EDAuth.logout();
        window.location.href = '../index.html';
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (window.EDAuth) {
            const u = window.EDAuth.currentUser();
            if (u) {
                const sideUserName = document.getElementById('sideUserName');
                if (sideUserName) sideUserName.textContent = u.name;
                const sideAv = document.getElementById('sideAvatar');
                if (sideAv) {
                    if (u.photo) {
                        sideAv.style.backgroundImage = `url(${u.photo})`;
                        sideAv.textContent = '';
                    } else {
                        sideAv.textContent = u.role === 'admin' ? '👑' : '⚔';
                    }
                }
                if (u.role === 'admin') {
                    document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                }
            }
        }
    });
</script>
  <script src="../configs/pwa.js" defer></script>
</body>
</html>
